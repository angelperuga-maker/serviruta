<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Administración · Serviruta</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.js"></script>
<style>
  :root{--bg:#0f1115;--panel:#171a21;--panel2:#1f232c;--border:#2a2f3a;--text:#e8eaed;--muted:#9aa1ac;--red:#e8210a;--green:#2ecc71;--yellow:#f0b429;--blue:#4f8ef7;--orange:#fb923c;--violet:#a78bfa;}
  *{box-sizing:border-box;}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);}
  header{padding:12px 16px;background:var(--panel);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:12px;}
  header h1{margin:0;font-size:17px;flex:1;}
  header .sub{color:var(--muted);font-size:12px;margin-top:2px;display:flex;gap:8px;align-items:center;}
  header a{color:var(--muted);font-size:12px;text-decoration:none;}
  .live{display:inline-flex;align-items:center;gap:5px;font-size:11px;color:var(--muted);}
  .live .dot{width:8px;height:8px;border-radius:50%;background:var(--muted);}
  .live.on .dot{background:var(--green);box-shadow:0 0 6px var(--green);}
  .wrap{max-width:1200px;margin:0 auto;padding:12px 14px 60px;}
  .toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px;}
  select,input,button,textarea{background:var(--panel2);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:8px 11px;font-size:14px;font-family:inherit;}
  select:focus,input:focus,textarea:focus{outline:none;border-color:var(--blue);}
  button{cursor:pointer;font-weight:600;}
  button.primary{background:var(--red);border-color:var(--red);color:#fff;}
  button.blue{background:var(--blue);border-color:var(--blue);color:#fff;}
  button.sm{padding:5px 9px;font-size:12px;}
  button.ghost{background:transparent;}
  .tabs{display:flex;gap:4px;margin-bottom:12px;border-bottom:1px solid var(--border);overflow-x:auto;}
  .tab{padding:9px 14px;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;}
  .tab.active{color:var(--text);border-color:var(--blue);}
  .kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-bottom:14px;}
  .kpi{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:10px 12px;}
  .kpi .n{font-size:18px;font-weight:700;}
  .kpi .l{font-size:11px;color:var(--muted);text-transform:uppercase;}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:12px 14px;margin-bottom:12px;}
  .card h3{margin:0 0 6px;font-size:15px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;}
  .row{display:flex;justify-content:space-between;font-size:13px;padding:4px 0;gap:8px;}
  .row .label{color:var(--muted);}
  .row.total{font-weight:700;border-top:1px solid var(--border);margin-top:4px;padding-top:8px;font-size:15px;}
  .pos{color:var(--green);} .neg{color:var(--red);} .warn{color:var(--yellow);}
  .tag{display:inline-block;font-size:11px;padding:2px 8px;border-radius:20px;background:var(--panel2);color:var(--muted);white-space:nowrap;}
  .tag.pagado,.tag.ok{background:rgba(46,204,113,.15);color:var(--green);}
  .tag.pendiente{background:rgba(240,180,41,.15);color:var(--yellow);}
  .tag.visita{background:rgba(79,142,247,.15);color:var(--blue);}
  .tag.fuera,.tag.off{background:rgba(251,146,60,.15);color:var(--orange);}
  .tag.tipo{background:rgba(167,139,250,.15);color:var(--violet);}
  .tbl{overflow-x:auto;}
  table{width:100%;border-collapse:collapse;font-size:13px;}
  th,td{padding:7px 8px;text-align:left;border-bottom:1px solid var(--border);white-space:nowrap;}
  th{color:var(--muted);font-weight:600;font-size:11px;text-transform:uppercase;}
  td.num,th.num{text-align:right;}
  td input{padding:5px 8px;font-size:13px;}
  .muted{color:var(--muted);font-size:12px;}
  .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.65);display:none;align-items:center;justify-content:center;z-index:100;padding:14px;}
  .modal-bg.show{display:flex;}
  .modal{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:18px;max-width:460px;width:100%;max-height:92vh;overflow-y:auto;}
  .modal h2{margin:0 0 10px;font-size:16px;}
  .field{margin-bottom:10px;}
  .field label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px;}
  .field select,.field input,.field textarea{width:100%;}
  .modal-actions{display:flex;gap:8px;margin-top:14px;}
  .modal-actions button{flex:1;}
  .empty{text-align:center;color:var(--muted);padding:40px;}
  .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;}
  .acts button{flex:1;min-width:90px;}
  .grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:12px;}
  details summary{cursor:pointer;color:var(--blue);font-size:12px;margin-top:8px;}
  .toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--border);padding:10px 16px;border-radius:10px;font-size:13px;display:none;z-index:200;}
  .hint{background:rgba(79,142,247,.08);border:1px solid rgba(79,142,247,.25);border-radius:10px;padding:10px 12px;font-size:12px;color:var(--muted);margin-bottom:12px;}
</style>
</head>
<body>
<header>
  <div style="flex:1">
    <h1>🧮 Administración</h1>
    <div class="sub"><span id="subTxt">Ventas, compras, comisiones y servicios</span><span class="live" id="live"><span class="dot"></span><span id="liveTxt">conectando…</span></span></div>
  </div>
  <a href="menu-admin.html" id="lnkMenu">← Menú</a>
</header>

<div class="wrap">
  <div class="toolbar">
    <select id="periodo" onchange="cambiarPeriodo()"></select>
    <select id="fTec" onchange="render()"><option value="">Todos los técnicos</option></select>
    <button class="ghost sm" onclick="cargar(true)">↻ Actualizar</button>
  </div>

  <div class="kpis" id="kpis"></div>

  <div class="tabs">
    <div class="tab active" data-t="resumen" onclick="setTab('resumen')">Resumen</div>
    <div class="tab" data-t="ventas" onclick="setTab('ventas')">Ventas y cobros</div>
    <div class="tab" data-t="compras" onclick="setTab('compras')">Compras</div>
    <div class="tab" data-t="comisiones" onclick="setTab('comisiones')">Comisiones y sueldos</div>
    <div class="tab" data-t="reglas" onclick="setTab('reglas')">Reglas de comisión</div>
    <div class="tab" data-t="equipo" onclick="setTab('equipo')">Equipo</div>
    <div class="tab" data-t="servicios" onclick="setTab('servicios')">Servicios</div>
  </div>

  <div id="view"><div class="empty">Cargando…</div></div>
</div>

<!-- Modal cobro -->
<div class="modal-bg" id="mCobro"><div class="modal">
  <h2>Registrar cobro</h2>
  <div class="muted" id="cobroInfo" style="margin-bottom:10px"></div>
  <div class="field"><label>Monto cobrado</label><input type="number" id="cMonto"></div>
  <div class="field"><label>Medio de pago</label><select id="cMedio"><option value="transferencia">Transferencia</option><option value="tarjeta">Tarjeta</option><option value="efectivo">Efectivo</option></select></div>
  <div class="field"><label>Fecha de pago</label><input type="date" id="cFecha"></div>
  <div class="modal-actions"><button class="ghost" onclick="closeModal('mCobro')">Cancelar</button><button class="primary" onclick="guardarCobro()">Marcar cobrado</button></div>
</div></div>

<!-- Modal compra -->
<div class="modal-bg" id="mCompra"><div class="modal">
  <h2>Registrar compra / gasto</h2>
  <div class="field"><label>Fecha</label><input type="date" id="gFecha"></div>
  <div class="field"><label>Tipo</label><select id="gTipo">
    <option value="Materiales">Materiales y repuestos</option><option value="Herramientas">Herramientas y equipos</option><option value="Combustible">Combustible y traslado</option><option value="Costos fijos">Costos fijos</option><option value="Impuestos">Impuestos y legal</option><option value="Otros">Otros</option></select></div>
  <div class="field"><label>Descripción</label><input id="gDesc" placeholder="Ej: Kit de embrague Foton"></div>
  <div class="field"><label>Proveedor</label><select id="gProv"><option value="">— sin proveedor —</option></select></div>
  <div class="field"><label>Monto</label><input type="number" id="gMonto"></div>
  <div class="field"><label>Medio de pago</label><select id="gMedio"><option value="transferencia">Transferencia empresa</option><option value="tarjeta">Tarjeta</option><option value="efectivo">Efectivo</option><option value="plata_propia">Plata propia (reembolsar)</option></select></div>
  <div class="field"><label>Técnico (opcional)</label><select id="gTec"><option value="">— general —</option></select></div>
  <div class="field"><label>Presupuesto asociado (opcional)</label><select id="gPpto"><option value="">— ninguno —</option></select></div>
  <div class="field"><label>N° documento / boleta</label><input id="gDoc"></div>
  <div class="field"><label>Notas</label><textarea id="gNotas" rows="2"></textarea></div>
  <div class="modal-actions"><button class="ghost" onclick="closeModal('mCompra')">Cancelar</button><button class="blue" onclick="guardarCompra()">Guardar</button></div>
</div></div>

<!-- Modal movimiento -->
<div class="modal-bg" id="mMov"><div class="modal">
  <h2 id="movTitulo">Registrar movimiento</h2>
  <div class="field"><label>Tipo</label><select id="mTipo" onchange="movTipoChange()"><option value="anticipo">Anticipo</option><option value="bono">Bono</option><option value="descuento">Descuento</option><option value="pago">Pago de sueldo</option></select></div>
  <div class="field" id="fCat" style="display:none"><label>Categoría del descuento</label><select id="mCat" onchange="movCatChange()"><option value="otro">Otro</option><option value="herramienta">Herramienta</option><option value="danio">Daño / retrabajo</option><option value="prestamo">Préstamo</option></select></div>
  <div class="field" id="fHerr" style="display:none"><label>Herramienta</label><select id="mHerr"></select></div>
  <div class="field"><label>Monto</label><input type="number" id="mMonto"></div>
  <div class="field"><label>Fecha</label><input type="date" id="mFecha"></div>
  <div class="field"><label>Notas</label><textarea id="mNotas" rows="2"></textarea></div>
  <div class="modal-actions"><button class="ghost" onclick="closeModal('mMov')">Cancelar</button><button class="primary" onclick="guardarMovimiento()">Guardar</button></div>
</div></div>

<!-- Modal técnico -->
<div class="modal-bg" id="mTec"><div class="modal">
  <h2 id="tecTitulo">Agregar técnico</h2>
  <div class="field"><label>Técnico del sistema (recomendado)</label><select id="tSel" onchange="tecSelChange()"><option value="">— nuevo, no está en la lista —</option></select></div>
  <div class="field"><label>Nombre</label><input id="tNombre"></div>
  <div class="field"><label>Teléfono</label><input id="tTel" placeholder="+569..."></div>
  <div class="field"><label>Sueldo base mensual</label><input type="number" id="tSueldo"></div>
  <div class="field"><label>Fecha de ingreso</label><input type="date" id="tFecha"></div>
  <div class="modal-actions"><button class="ghost" onclick="closeModal('mTec')">Cancelar</button><button class="blue" onclick="guardarTecnico()">Guardar</button></div>
</div></div>

<!-- Modal tipo de servicio -->
<div class="modal-bg" id="mTipoSrv"><div class="modal">
  <h2 id="tsTitulo">Tipo de servicio</h2>
  <div class="field"><label>Nombre</label><input id="tsNombre"></div>
  <div class="field"><label>Palabras clave (separadas por coma) — se buscan en la descripción del presupuesto</label><input id="tsKeys" placeholder="embrague, clutch"></div>
  <div class="field"><label>% de comisión sobre el total del trabajo</label><input type="number" step="0.5" id="tsPct"></div>
  <div class="field"><label>Vigente desde</label><input type="date" id="tsDesde"></div>
  <div class="field"><label>Orden de prioridad (menor = primero)</label><input type="number" id="tsOrden" value="100"></div>
  <div class="field"><label><input type="checkbox" id="tsActivo" style="width:auto"> Activo</label></div>
  <div class="modal-actions"><button class="ghost" onclick="closeModal('mTipoSrv')">Cancelar</button><button class="blue" onclick="guardarTipoSrv()">Guardar</button></div>
</div></div>

<div class="toast" id="toast"></div>

<script>
const SUPABASE_URL = 'https://bqlgfmqcefledqyodkii.supabase.co';
const SUPABASE_KEY = 'sb_publishable_h33L3eMAcskEsPi93Liohg__FfzCxOE';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

// ---- guard: admin, owner o senior ----
(async function(){
  try{
    const {data:{session}} = await sb.auth.getSession();
    if(!session){ window.location.replace('login.html'); return; }
    const r = await fetch(SUPABASE_URL+'/rest/v1/user_profiles?user_id=eq.'+session.user.id+'&select=nombre,rol,username',{headers:{'apikey':SUPABASE_KEY,'Authorization':'Bearer '+session.access_token}});
    const p = r.ok ? await r.json() : [];
    const rol = p[0] ? p[0].rol : null;
    if(!rol || !['admin','owner','coord_senior'].includes(rol)){ window.location.replace('login.html'); return; }
    document.getElementById('lnkMenu').href = rol==='admin' ? 'menu-admin.html' : 'menu-coordinador.html';
    window.SV_USER = p[0].username;
  }catch(e){ console.error(e); }
})();

let tab = (location.hash||'#resumen').slice(1);
let periodo = mesActual();
let D = { pptos:[], liq:[], det:[], movs:[], emp:[], empTodos:[], tecs:[], herr:[], params:[], tramos:[], tipos:[], gastos:[], prov:[], agenda:[] };
let cobroId=null, movEmp=null, tipoSrvId=null, filtroPago='todos', filtroGasto='';

function mesActual(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); }
function fmt(n){ return '$'+Math.round(n||0).toLocaleString('es-CL'); }
function esc(s){ return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function hoy(){ return new Date().toISOString().slice(0,10); }
function toast(m){ const t=document.getElementById('toast'); t.textContent=m; t.style.display='block'; setTimeout(()=>t.style.display='none',2500); }
function closeModal(id){ document.getElementById(id).classList.remove('show'); }
function openModal(id){ document.getElementById(id).classList.add('show'); }

function generarPeriodos(){
  const sel=document.getElementById('periodo'); const d=new Date(); let html='';
  for(let i=0;i<14;i++){ const p=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
    const lbl=d.toLocaleDateString('es-CL',{month:'long',year:'numeric'});
    html+=`<option value="${p}" ${p===periodo?'selected':''}>${lbl}</option>`; d.setMonth(d.getMonth()-1); }
  sel.innerHTML=html;
}
function cambiarPeriodo(){ periodo=document.getElementById('periodo').value; cargar(); }
function setTab(t){ tab=t; history.replaceState(null,'','#'+t); document.querySelectorAll('.tab').forEach(e=>e.classList.toggle('active',e.dataset.t===t)); render(); }
window.addEventListener('hashchange',()=>{ setTab((location.hash||'#resumen').slice(1)); });

async function cargar(manual){
  const ini=periodo+'-01', fin=new Date(periodo.slice(0,4), periodo.slice(5,7), 1).toISOString().slice(0,10);
  const R = await Promise.all([
    sb.from('presupuestos').select('id,numero,tecnico,tecnico_id,cliente,telefono,vehiculo,patente,items,obs,total,estado,estado_servicio,pago_cliente,fecha_pago,pagado_at,monto_cobrado,medio_pago,created_at,agenda_id')
      .or(`and(created_at.gte.${ini},created_at.lt.${fin}),and(fecha_pago.gte.${ini},fecha_pago.lt.${fin})`).neq('estado','nuevo').order('created_at',{ascending:false}).limit(3000),
    sb.from('v_liquidacion_tecnico').select('*').eq('periodo',periodo).order('cobrado',{ascending:false}),
    sb.from('v_comision_detalle').select('*').eq('periodo',periodo).order('fecha'),
    sb.from('movimientos_remuneracion').select('*').eq('periodo',periodo).order('fecha',{ascending:false}),
    sb.from('empleados_rrhh').select('*').order('nombre'),
    sb.from('tecnicos').select('id,nombre,telefono,activo').order('nombre'),
    sb.from('herramientas').select('id,tecnico_id,nombre,valor,estado'),
    sb.from('comision_params').select('*').order('clave'),
    sb.from('comision_tramos').select('*').eq('vigente',true).order('desde'),
    sb.from('comision_tipo_servicio').select('*').order('orden'),
    sb.from('gastos').select('*').gte('fecha',ini).lt('fecha',fin).order('fecha',{ascending:false}),
    sb.from('proveedores').select('id,nombre,categoria').eq('activo',true).order('nombre'),
    sb.from('agenda').select('id,fecha,hora,tecnico,tecnico_id,cliente,telefono,vehiculo,patente,servicio,estado,presupuesto_id,origen,direccion').gte('fecha',ini).lt('fecha',fin).order('fecha',{ascending:false}).order('hora').limit(3000),
  ]);
  const [p,l,d,m,e,t,h,pa,tr,ts,g,pv,ag]=R;
  D={ pptos:p.data||[], liq:l.data||[], det:d.data||[], movs:m.data||[], empTodos:e.data||[], emp:(e.data||[]).filter(x=>x.activo), tecs:t.data||[], herr:h.data||[], params:pa.data||[], tramos:tr.data||[], tipos:ts.data||[], gastos:g.data||[], prov:pv.data||[], agenda:ag.data||[] };
  const err=R.find(r=>r.error); if(err) toast('Error: '+err.error.message);
  const ft=document.getElementById('fTec'); const cur=ft.value;
  ft.innerHTML='<option value="">Todos los técnicos</option>'+D.emp.filter(x=>x.cargo==='tecnico').map(x=>`<option value="${x.id}">${esc(x.nombre)}</option>`).join('');
  ft.value=cur;
  render(); if(manual) toast('Actualizado');
}

function empSel(){ return document.getElementById('fTec').value; }
function empDe(p){ const e=D.emp.find(x=>x.tecnico_id===p.tecnico_id); return e?e.id:null; }
function nombreTec(p){ const e=D.empTodos.find(x=>x.tecnico_id===p.tecnico_id); return e?e.nombre:(p.tecnico||'—'); }
function resumenItems(items){ try{ const a=Array.isArray(items)?items:[]; return a.map(i=>i.desc||i.descripcion||i.nombre||i.item||'').filter(Boolean).join(', ').slice(0,70); }catch{ return ''; } }
function tecFiltro(x){ const f=empSel(); if(!f) return true; const e=D.emp.find(y=>y.id===f); return e && (x.tecnico_id===e.tecnico_id || (x.tecnico||'').toLowerCase().startsWith(e.nombre.toLowerCase().split(' ')[0])); }

function totales(){
  const f=empSel(); const pp=D.pptos.filter(p=>!f||empDe(p)===f); const liq=D.liq.filter(l=>!f||l.empleado_id===f);
  const cob=pp.filter(p=>p.pago_cliente==='pagado'); const pend=pp.filter(p=>p.pago_cliente!=='pagado'&&p.total>0);
  const gastos=D.gastos.filter(g=>!f||tecFiltro(g));
  return {
    cobrado: cob.reduce((s,p)=>s+(p.monto_cobrado||p.total||0),0), nCob: cob.length,
    porCobrar: pend.reduce((s,p)=>s+(p.total||0),0), nPend: pend.length,
    compras: gastos.reduce((s,g)=>s+(g.monto||0),0), nCompras: gastos.length,
    comisiones: liq.reduce((s,l)=>s+l.comision_neta,0),
    haberes: liq.reduce((s,l)=>s+l.haberes,0),
    saldo: liq.reduce((s,l)=>s+l.saldo_por_pagar,0),
    cob, pend, gastos, liq
  };
}
function kpis(){
  const t=totales(); const margen=t.cobrado-t.compras-t.haberes;
  const k=[['Cobrado',fmt(t.cobrado)+` <span class="muted">(${t.nCob})</span>`,'pos'],['Por cobrar',fmt(t.porCobrar)+` <span class="muted">(${t.nPend})</span>`,'warn'],['Compras y gastos',fmt(t.compras)],['Comisiones',fmt(t.comisiones)],['Sueldos (haberes)',fmt(t.haberes)],['Margen estimado',fmt(margen),margen>=0?'pos':'neg']];
  document.getElementById('kpis').innerHTML=k.map(x=>`<div class="kpi"><div class="n ${x[2]||''}">${x[1]}</div><div class="l">${x[0]}</div></div>`).join('');
}

function render(){
  kpis();
  const v=document.getElementById('view');
  const map={resumen:renderResumen,ventas:renderVentas,compras:renderCompras,comisiones:renderLiquidacion,reglas:renderReglas,equipo:renderEquipo,servicios:renderServicios};
  v.innerHTML=(map[tab]||renderResumen)();
}

/* ---------- RESUMEN ---------- */
function renderResumen(){
  const t=totales();
  const porTec={}; t.cob.forEach(p=>{ const n=nombreTec(p); porTec[n]=porTec[n]||{n:0,m:0}; porTec[n].n++; porTec[n].m+=(p.monto_cobrado||p.total||0); });
  const porMedio={}; t.cob.forEach(p=>{ const k=p.medio_pago||'sin dato'; porMedio[k]=(porMedio[k]||0)+(p.monto_cobrado||p.total||0); });
  const porTipo={}; t.gastos.forEach(g=>{ porTipo[g.tipo||'Otros']=(porTipo[g.tipo||'Otros']||0)+(g.monto||0); });
  let h='<div class="grid2">';

  h+=`<div class="card"><h3>Remuneraciones del mes</h3><table><tbody>${t.liq.map(l=>`<tr><td>${esc(l.nombre)}</td><td class="muted">${l.trabajos} trab.</td><td class="num">${fmt(l.comision_neta)}</td><td class="num"><b>${fmt(l.haberes)}</b></td></tr>`).join('')||'<tr><td class="muted">—</td></tr>'}</tbody></table><div class="muted" style="margin-top:6px">comisión neta · total haberes</div></div>`;
  h+=`<div class="card"><h3>Resultado del mes</h3>

    <div class="muted" style="margin-top:6px">No incluye costos fijos que no estén cargados en gastos (publicidad, sistema, etc.).</div></div>`;
  return h+'</div>';
}

  const {error}=await q; if(error) return toast('Error: '+error.message); closeModal('mTipoSrv'); toast('Guardado'); cargar(); }
async function toggleTipoSrv(id,activo){ const {error}=await sb.from('comision_tipo_servicio').update({activo,updated_at:new Date().toISOString()}).eq('id',id); if(error) return toast('Error: '+error.message); cargar(); }
async function guardarTramo(id,campo,valor){ const v=campo==='requiere_llave'?valor:(valor===''?null:parseFloat(valor)); const {error}=await sb.from('comision_tramos').update({[campo]:v}).eq('id',id); if(error) return toast('Error: '+error.message); toast('Tramo guardado'); cargar(); }
async function guardarParam(clave,valor){ const {error}=await sb.from('comision_params').update({valor:parseFloat(valor),updated_at:new Date().toISOString()}).eq('clave',clave); if(error) return toast('Error: '+error.message); toast('Parámetro guardado'); cargar(); }

/* ---------- EQUIPO ---------- */
function renderEquipo(){
  const act=D.empTodos.filter(e=>e.cargo==='tecnico'&&e.activo); const inact=D.empTodos.filter(e=>e.cargo==='tecnico'&&!e.activo&&e.tecnico_id);
  let h=`<div class="card"><h3>Técnicos activos (${act.length}) <button class="sm blue" onclick="abrirTec()">+ Agregar técnico</button></h3>
    <div class="muted" style="margin-bottom:8px">El sueldo base se edita aquí y aplica de inmediato a la liquidación del mes. "Quitar" lo saca del equipo (no borra su historial; se puede reincorporar).</div>
    <div class="tbl"><table><thead><tr><th>Nombre</th><th>Teléfono</th><th class="num">Sueldo base</th><th>Ingreso</th><th>Vínculo sistema</th><th></th></tr></thead><tbody>`;
  for(const e of act){ const t=D.tecs.find(x=>x.id===e.tecnico_id);
    h+=`<tr><td><b>${esc(e.nombre)}</b></td><td class="muted">${esc(e.telefono||'')}</td><td class="num"><input type="number" value="${e.sueldo_base||0}" style="width:130px;text-align:right" onchange="guardarSueldo('${e.id}',this.value)"></td><td class="muted">${e.fecha_ingreso||''}</td><td>${t?`<span class="tag ok">${esc(t.nombre)}</span>`:'<span class="tag off">sin vincular</span>'}</td><td><button class="sm ghost" onclick="quitarTec('${e.id}')">Quitar</button></td></tr>`; }
  h+='</tbody></table></div></div>';
  // dedupe inactivos por tecnico_id
  const seen=new Set(); const inactU=inact.filter(e=>{ if(seen.has(e.tecnico_id)||act.some(a=>a.tecnico_id===e.tecnico_id)) return false; seen.add(e.tecnico_id); return true; });
  if(inactU.length){ h+=`<div class="card"><h3>Técnicos retirados</h3><div class="tbl"><table><tbody>`;
    for(const e of inactU) h+=`<tr><td>${esc(e.nombre)}</td><td class="muted">${esc(e.telefono||'')}</td><td><button class="sm ghost" onclick="reincorporarTec('${e.id}')">Reincorporar</button></td></tr>`;
    h+='</tbody></table></div></div>'; }
  return h;
}
function abrirTec(){
  const usados=new Set(D.emp.filter(e=>e.cargo==='tecnico').map(e=>e.tecnico_id));
  document.getElementById('tSel').innerHTML='<option value="">— nuevo, no está en la lista —</option>'+D.tecs.filter(t=>!usados.has(t.id)).map(t=>`<option value="${t.id}" data-n="${esc(t.nombre)}" data-tel="${esc(t.telefono||'')}">${esc(t.nombre)}${t.activo?'':' (inactivo)'}</option>`).join('');
  document.getElementById('tNombre').value=''; document.getElementById('tTel').value=''; document.getElementById('tFecha').value=hoy();
  const ref=D.params.find(p=>p.clave==='sueldo_base_ref'); document.getElementById('tSueldo').value=ref?ref.valor:'';
  openModal('mTec');
}
function tecSelChange(){ const o=document.getElementById('tSel').selectedOptions[0]; if(o&&o.value){ document.getElementById('tNombre').value=o.dataset.n; document.getElementById('tTel').value=o.dataset.tel; } }
async function guardarTecnico(){
  const nombre=document.getElementById('tNombre').value.trim(); if(!nombre) return toast('Falta el nombre');
  let tecnico_id=document.getElementById('tSel').value||null; const telefono=document.getElementById('tTel').value.trim()||null;
  if(!tecnico_id){ const {data,error}=await sb.from('tecnicos').insert({nombre,telefono,activo:true}).select('id').single(); if(error) return toast('Error creando técnico: '+error.message); tecnico_id=data.id; }
  // si existe registro inactivo para ese tecnico_id, reactivar en vez de duplicar
  const prev=D.empTodos.find(e=>e.tecnico_id===tecnico_id&&e.cargo==='tecnico');
  const payload={nombre,cargo:'tecnico',telefono,sueldo_base:parseInt(document.getElementById('tSueldo').value||0),fecha_ingreso:document.getElementById('tFecha').value||null,activo:true,tecnico_id};
  const q=prev?sb.from('empleados_rrhh').update(payload).eq('id',prev.id):sb.from('empleados_rrhh').insert(payload);
  const {error}=await q; if(error) return toast('Error: '+error.message);
  await sb.from('tecnicos').update({activo:true}).eq('id',tecnico_id);
  closeModal('mTec'); toast('Técnico agregado'); cargar();
}
async function guardarSueldo(id,v){ const {error}=await sb.from('empleados_rrhh').update({sueldo_base:parseInt(v||0)}).eq('id',id); if(error) return toast('Error: '+error.message); toast('Sueldo base actualizado'); cargar(); }
async function quitarTec(id){ const e=D.empTodos.find(x=>x.id===id); if(!confirm('¿Quitar a '+(e?e.nombre:'')+' del equipo? Dejará de aparecer en liquidaciones y de recibir asignaciones.')) return;
  const {error}=await sb.from('empleados_rrhh').update({activo:false}).eq('id',id); if(error) return toast('Error: '+error.message);
  if(e&&e.tecnico_id) await sb.from('tecnicos').update({activo:false,disponible:false}).eq('id',e.tecnico_id);
  toast('Técnico retirado'); cargar(); }
async function reincorporarTec(id){ const e=D.empTodos.find(x=>x.id===id); const {error}=await sb.from('empleados_rrhh').update({activo:true}).eq('id',id); if(error) return toast('Error: '+error.message);
  if(e&&e.tecnico_id) await sb.from('tecnicos').update({activo:true}).eq('id',e.tecnico_id); toast('Reincorporado'); cargar(); }

/* ---------- SERVICIOS ---------- */
function renderServicios(){
  const f=empSel(); const ag=D.agenda.filter(a=>!f||tecFiltro(a));
  const est={}; ag.forEach(a=>{ est[a.estado||'?']=(est[a.estado||'?']||0)+1; });
  let h=`<div class="toolbar"><span class="muted">${ag.length} servicios agendados en el período</span>${Object.entries(est).map(([k,n])=>`<span class="tag">${esc(k)}: ${n}</span>`).join(' ')}</div>`;
  if(!ag.length) return h+'<div class="empty">Sin servicios en este período</div>';
  h+=`<div class="card tbl"><table><thead><tr><th>Fecha</th><th>Hora</th><th>Técnico</th><th>Cliente</th><th>Vehículo</th><th>Servicio</th><th>Origen</th><th>Estado</th><th>Presupuesto</th></tr></thead><tbody>`;
  for(const a of ag){ const p=a.presupuesto_id?D.pptos.find(x=>x.id===a.presupuesto_id):null;
    h+=`<tr><td>${a.fecha||''}</td><td>${a.hora||''}</td><td>${esc(a.tecnico||'')}</td><td>${esc(a.cliente||'')}</td><td>${esc(a.vehiculo||'')} <span class="muted">${esc(a.patente||'')}</span></td><td style="white-space:normal;max-width:260px">${esc(a.servicio||'')}</td><td class="muted">${esc(a.origen||'')}</td><td><span class="tag">${esc(a.estado||'')}</span></td><td>${p?`#${p.numero||''} ${fmt(p.total)} ${p.pago_cliente==='pagado'?'<span class="tag pagado">pagado</span>':'<span class="tag pendiente">pendiente</span>'}`:'<span class="muted">—</span>'}</td></tr>`; }
  return h+'</tbody></table></div>';
}

/* ---- tiempo real ---- */
let refrescoPend=null;
function programarRefresco(){ clearTimeout(refrescoPend); refrescoPend=setTimeout(()=>cargar(),800); }
function conectarRealtime(){
  const ch=sb.channel('administracion-live');
  ['presupuestos','movimientos_remuneracion','empleados_rrhh','gastos','agenda','comision_params','comision_tramos','comision_tipo_servicio','incidencias_tecnico','asistencia_tecnico'].forEach(t=>ch.on('postgres_changes',{event:'*',schema:'public',table:t},programarRefresco));
  ch.subscribe(st=>{ const el=document.getElementById('live'); const ok=st==='SUBSCRIBED'; el.classList.toggle('on',ok); document.getElementById('liveTxt').textContent=ok?'en vivo':'reconectando…'; });
  setInterval(()=>cargar(),60000);
}

generarPeriodos(); document.querySelectorAll('.tab').forEach(e=>e.classList.toggle('active',e.dataset.t===tab)); cargar(); conectarRealtime();
</script>
