<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Agenda · Serviruta</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800;900&family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0A0A0D;--s1:#111114;--s2:#16161B;--s3:#1C1C23;--line:#26262E;--rojo:#E8210A;--rojo-l:#FF4D2E;--verde:#22C55E;--amarillo:#F5C518;--azul:#60A5FA;--violeta:#A78BFA;--dorado:#D4AF37;--naranja:#F97316;--t1:#F6F4EF;--t2:#C7C5BF;--t3:#8B8990;--display:'Syne',sans-serif;--body:'DM Sans',sans-serif;--mono:'JetBrains Mono',monospace}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--t2);font-family:var(--body);font-size:14px;line-height:1.5;min-height:100vh;padding-bottom:80px}
button,input,select,textarea{border:none;background:none;color:inherit;font-family:inherit;font-size:14px}
input,select,textarea{background:var(--s2);border:1px solid var(--line);border-radius:8px;padding:9px 12px;color:var(--t1);width:100%}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--dorado)}

.bar{position:sticky;top:0;z-index:50;background:rgba(10,10,13,0.95);backdrop-filter:blur(16px);border-bottom:1px solid var(--line);padding:12px 16px;display:flex;align-items:center;gap:10px}
.back{font-family:var(--mono);font-size:10px;color:var(--t3);padding:6px 10px;border:1px solid var(--line);border-radius:6px;cursor:pointer}
.sigil{width:34px;height:34px;background:linear-gradient(135deg,var(--rojo),var(--dorado));border-radius:8px;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:800;font-size:14px;color:#000}
.title{font-family:var(--display);font-weight:800;font-size:14px;color:var(--t1);flex:1;line-height:1.1}
.title small{display:block;font-family:var(--mono);font-size:9px;color:var(--dorado);letter-spacing:0.15em;margin-top:2px;font-weight:700}
.btn-add{padding:8px 14px;background:var(--dorado);color:#000;border-radius:8px;font-family:var(--display);font-weight:800;font-size:11px;cursor:pointer;letter-spacing:0.05em}

.controls{background:var(--s1);border-bottom:1px solid var(--line);padding:12px 16px;display:flex;flex-direction:column;gap:10px}
.vista-tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.vista-tabs::-webkit-scrollbar{display:none}
.tab{padding:8px 14px;background:var(--s2);border:1px solid var(--line);border-radius:10px;font-family:var(--mono);font-size:11px;color:var(--t2);cursor:pointer;font-weight:700;letter-spacing:0.05em;white-space:nowrap}
.tab:hover{color:var(--t1)}
.tab.active{background:var(--dorado);color:#000;border-color:var(--dorado)}

.rango-nav{display:flex;align-items:center;gap:8px;justify-content:space-between;flex-wrap:wrap}
.rango-btns{display:flex;gap:6px}
.rango-btn{padding:6px 10px;background:var(--s2);border:1px solid var(--line);border-radius:6px;font-family:var(--mono);font-size:10px;color:var(--t2);cursor:pointer;font-weight:700}
.rango-btn:hover{color:var(--t1)}
.rango-btn.hoy{background:rgba(212,175,55,0.15);color:var(--dorado);border-color:var(--dorado)}
.rango-fecha{font-family:var(--display);font-weight:800;font-size:16px;color:var(--t1);letter-spacing:-0.3px;text-align:center}
.rango-fecha small{display:block;font-family:var(--mono);font-size:9px;color:var(--t3);letter-spacing:0.1em;font-weight:700;margin-top:1px}

.tec-filter{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.tec-filter::-webkit-scrollbar{display:none}
.chip-tec{padding:6px 12px;background:var(--s2);border:1px solid var(--line);border-radius:8px;font-family:var(--mono);font-size:10px;color:var(--t2);cursor:pointer;font-weight:700;letter-spacing:0.05em;white-space:nowrap;display:flex;align-items:center;gap:6px}
.chip-tec:hover{color:var(--t1)}
.chip-tec.active{background:var(--dorado);color:#000;border-color:var(--dorado)}
.tec-dot{width:8px;height:8px;border-radius:50%}

.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:12px 16px;background:var(--s1);border-bottom:1px solid var(--line)}
.kpi{background:var(--s2);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.kpi-lbl{font-family:var(--mono);font-size:8px;color:var(--t3);letter-spacing:0.1em;text-transform:uppercase;font-weight:700}
.kpi-val{font-family:var(--display);font-weight:900;font-size:20px;color:var(--t1);margin-top:2px;line-height:1}
.kpi.urg .kpi-val{color:var(--rojo-l)}
.kpi.pend .kpi-val{color:var(--amarillo)}
.kpi.asig .kpi-val{color:var(--verde)}
.kpi.comp .kpi-val{color:var(--azul)}

.shell{max-width:1400px;margin:0 auto;padding:14px 16px}

.carriles{display:grid;gap:10px}
.carril{background:var(--s1);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.carril-hdr{background:var(--s2);padding:10px 14px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line)}
.carril-avatar{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,var(--dorado),var(--rojo));display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:900;color:#000;font-size:12px}
.carril-nom{font-family:var(--display);font-weight:800;font-size:14px;color:var(--t1);flex:1}
.carril-count{font-family:var(--mono);font-size:10px;color:var(--t3);letter-spacing:0.05em;font-weight:700}
.carril-body{padding:10px}
.carril-body.vacio{padding:20px;text-align:center;color:var(--t3);font-size:12px;font-style:italic}

.evento{background:var(--s2);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:8px;display:grid;grid-template-columns:auto 1fr auto;gap:12px;cursor:pointer;transition:border-color 200ms;border-left:3px solid var(--verde)}
.evento:hover{border-color:var(--dorado)}
.evento.urgente{border-left-color:var(--rojo)}
.evento.solicitada{border-left-color:var(--amarillo)}
.evento.completado{border-left-color:var(--azul);opacity:0.75}
.evento.reagendar{border-left-color:var(--naranja)}
.evento.cancelado{border-left-color:var(--t3);opacity:0.5}
.evento.sin-tec{border-left-color:var(--amarillo)}
.ev-hora{font-family:var(--mono);font-size:13px;font-weight:700;color:var(--t1);letter-spacing:0.05em}
.ev-hora small{display:block;font-size:8px;color:var(--t3);font-weight:700;margin-top:2px;letter-spacing:0.1em}
.ev-body{min-width:0}
.ev-cliente{color:var(--t1);font-weight:700;font-size:13px;margin-bottom:2px}
.ev-servicio{color:var(--t2);font-size:11px;margin-bottom:4px;line-height:1.4}
.ev-meta{display:flex;gap:8px;font-family:var(--mono);font-size:9px;color:var(--t3);letter-spacing:0.05em;flex-wrap:wrap}
.ev-badge{font-family:var(--mono);font-size:7px;padding:1px 5px;border-radius:3px;font-weight:700;letter-spacing:0.05em;display:inline-block;margin-left:4px}
.ev-badge.urg{background:rgba(232,33,10,0.2);color:var(--rojo-l)}
.ev-badge.bot{background:rgba(212,175,55,0.15);color:var(--dorado)}
.ev-badge.est{background:var(--s3);color:var(--t2)}
.ev-badge.conf-ok{background:rgba(34,197,94,0.15);color:var(--verde)}
.ev-badge.conf-pend{background:rgba(245,197,24,0.15);color:var(--amarillo)}
.ev-actions{display:flex;flex-direction:column;gap:4px;align-items:flex-end;min-width:120px}
.ev-btn{padding:4px 8px;background:var(--s3);border:1px solid var(--line);border-radius:5px;font-family:var(--mono);font-size:9px;color:var(--t2);cursor:pointer;font-weight:700;white-space:nowrap;letter-spacing:0.05em}
.ev-btn.chat{background:rgba(34,197,94,0.1);border-color:rgba(34,197,94,0.35);color:var(--verde)}
.ev-assign{width:100%;padding:5px 8px;background:var(--s3);border:1px solid var(--line);border-radius:5px;font-family:var(--mono);font-size:9px;color:var(--t1);cursor:pointer;font-weight:700;letter-spacing:0.05em}
.ev-assign.sin-tec{background:rgba(245,197,24,0.15);border-color:rgba(245,197,24,0.4);color:var(--amarillo)}
.ev-assign:hover{border-color:var(--dorado)}
.ev-assign:focus{outline:none;border-color:var(--dorado)}
.ev-estado-quick{display:flex;gap:2px;flex-wrap:wrap;margin-top:2px}
.ev-est-btn{padding:2px 6px;background:var(--s3);border:1px solid var(--line);border-radius:4px;font-family:var(--mono);font-size:8px;color:var(--t3);cursor:pointer;font-weight:700;letter-spacing:0.05em}
.ev-est-btn:hover{color:var(--t1);border-color:var(--dorado)}
.ev-est-btn.active-est{background:var(--verde);color:#000;border-color:var(--verde)}
.ev-est-btn.ev-can{background:rgba(249,115,22,0.08);border-color:rgba(249,115,22,0.35);color:var(--naranja)}
.ev-est-btn.ev-can:hover{background:rgba(249,115,22,0.2);color:var(--naranja)}
.ev-est-btn.ev-can.active-can{background:var(--naranja);color:#000;border-color:var(--naranja)}
.ev-est-btn.ev-del{background:rgba(232,33,10,0.08);border-color:rgba(232,33,10,0.35);color:var(--rojo-l)}
.ev-est-btn.ev-del:hover{background:rgba(232,33,10,0.2)}

/* Sugerencia inteligente inline */
.ev-sugerencia{background:linear-gradient(135deg,rgba(212,175,55,0.12),rgba(212,175,55,0.04));border:1px solid rgba(212,175,55,0.4);border-radius:8px;padding:6px 8px;margin-top:4px;cursor:pointer;transition:all 200ms}
.ev-sugerencia:hover{background:linear-gradient(135deg,rgba(212,175,55,0.25),rgba(212,175,55,0.1));border-color:var(--dorado);transform:translateY(-1px);box-shadow:0 2px 8px rgba(212,175,55,0.15)}
.sug-lbl{font-family:var(--mono);font-size:8px;color:var(--dorado);letter-spacing:0.15em;font-weight:700;margin-bottom:3px}
.sug-content{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--t1);font-weight:700;margin-bottom:3px}
.sug-tec-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.sug-nombre{color:var(--t1)}
.sug-dist{color:var(--verde);font-family:var(--mono);font-size:9px;font-weight:700;margin-left:auto}
.sug-cta{font-family:var(--mono);font-size:9px;color:var(--verde);font-weight:700;letter-spacing:0.05em;text-align:center}

.ev-sug-geo{background:rgba(96,165,250,0.08);border:1px dashed rgba(96,165,250,0.35);border-radius:8px;padding:6px 8px;margin-top:4px;cursor:pointer;font-family:var(--mono);font-size:9px;color:var(--azul);text-align:center;font-weight:700;letter-spacing:0.05em;transition:all 200ms}
.ev-sug-geo:hover{background:rgba(96,165,250,0.15);border-color:var(--azul)}

.semana{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
.mes{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.mes .dia-mes{background:var(--s1);border:1px solid var(--line);border-radius:8px;overflow:hidden;min-height:110px;font-size:11px;display:flex;flex-direction:column}
.mes .dia-mes.hoy{border-color:var(--dorado);box-shadow:0 0 0 1px var(--dorado)}
.mes .dia-mes.otro-mes{opacity:0.35}
.mes .dia-mes-hdr{background:var(--s2);padding:4px 6px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;font-family:var(--mono);font-size:9px;color:var(--t3);letter-spacing:0.05em;font-weight:700}
.mes .dia-mes-hdr .num{font-family:var(--display);font-size:14px;color:var(--t1);font-weight:900;letter-spacing:-0.5px}
.mes .dia-mes.hoy .dia-mes-hdr .num{color:var(--dorado)}
.mes .dia-mes-body{padding:3px;flex:1;overflow-y:auto;max-height:200px}
.mes .mini-ev{background:var(--s2);border-left:2px solid var(--dorado);border-radius:4px;padding:3px 5px;margin-bottom:2px;font-size:9px;line-height:1.3;cursor:pointer}
.mes .mini-ev:hover{background:var(--s3)}
.mes .mini-ev.urg{border-left-color:var(--rojo)}
.mes .mini-ev-hora{font-family:var(--mono);color:var(--dorado);font-weight:700;font-size:8px}
.mes .mini-ev-cli{color:var(--t1);font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mes .mas-eventos{text-align:center;color:var(--t3);font-family:var(--mono);font-size:8px;font-weight:700;padding:2px}
.mes-hdr-row{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:6px}
.mes-hdr-row .hdr{text-align:center;padding:6px;font-family:var(--mono);font-size:9px;color:var(--t3);letter-spacing:0.1em;font-weight:700;text-transform:uppercase;background:var(--s2);border-radius:6px}
.dia{background:var(--s1);border:1px solid var(--line);border-radius:12px;overflow:hidden;min-height:200px}
.dia.hoy{border-color:var(--dorado);box-shadow:0 0 0 1px var(--dorado)}
.dia-hdr{background:var(--s2);padding:8px 10px;border-bottom:1px solid var(--line);text-align:center}
.dia-hdr .dia-lbl{font-family:var(--mono);font-size:9px;color:var(--t3);letter-spacing:0.1em;text-transform:uppercase;font-weight:700}
.dia-hdr .dia-num{font-family:var(--display);font-weight:900;font-size:20px;color:var(--t1);letter-spacing:-0.5px;line-height:1;margin-top:1px}
.dia.hoy .dia-hdr .dia-num{color:var(--dorado)}
.dia-body{padding:6px;max-height:400px;overflow-y:auto}
.dia-body.vacio{padding:16px 8px;text-align:center;color:var(--t3);font-size:10px;font-style:italic}
.mini-ev{background:var(--s2);border-radius:6px;padding:6px 8px;margin-bottom:4px;font-size:11px;cursor:pointer;border-left:3px solid var(--verde)}
.mini-ev.urgente{border-left-color:var(--rojo)}
.mini-ev.solicitada{border-left-color:var(--amarillo)}
.mini-ev.completado{border-left-color:var(--azul);opacity:0.7}
.mini-hora{font-family:var(--mono);font-size:9px;color:var(--dorado);font-weight:700;letter-spacing:0.05em}
.mini-cli{font-weight:700;color:var(--t1);font-size:11px;margin:2px 0;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini-tec{font-family:var(--mono);font-size:8px;color:var(--t3);letter-spacing:0.05em}

.tec-semana{background:var(--s1);border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-bottom:14px}
.tec-hdr{background:linear-gradient(135deg,var(--s2),var(--s1));padding:14px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px}
.tec-avatar-lg{width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,var(--dorado),var(--rojo));display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:900;color:#000;font-size:16px}
.tec-info{flex:1}
.tec-nom-lg{font-family:var(--display);font-weight:800;font-size:16px;color:var(--t1);letter-spacing:-0.3px}
.tec-stats{font-family:var(--mono);font-size:10px;color:var(--t3);margin-top:2px;letter-spacing:0.05em}
.tec-dias{display:grid;grid-template-columns:100px 1fr;border-bottom:1px solid var(--line)}
.tec-dias:last-child{border-bottom:none}
.tec-dia-lbl{background:var(--s2);padding:12px 14px;font-family:var(--mono);font-size:10px;color:var(--t3);letter-spacing:0.1em;font-weight:700;text-transform:uppercase;border-right:1px solid var(--line);display:flex;flex-direction:column;justify-content:center}
.tec-dia-lbl.hoy{color:var(--dorado)}
.tec-dia-lbl .fecha{font-family:var(--display);font-weight:900;font-size:18px;color:var(--t1);margin-top:2px}
.tec-dia-lbl.hoy .fecha{color:var(--dorado)}
.tec-dia-content{padding:10px 12px}
.tec-dia-content.vacio{padding:14px;color:var(--t3);font-style:italic;font-size:11px}

.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,0.85);display:none;align-items:center;justify-content:center;padding:16px;z-index:200;backdrop-filter:blur(6px)}
.modal-bg.open{display:flex}
.modal{background:var(--s1);border:1px solid var(--line);border-radius:16px;max-width:640px;width:100%;max-height:90vh;overflow-y:auto;padding:24px}
.modal-tit{font-family:var(--display);font-weight:900;font-size:18px;color:var(--t1);margin-bottom:16px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.form-full{grid-column:1/-1}
.form-lbl{font-family:var(--mono);font-size:10px;color:var(--t3);letter-spacing:0.1em;font-weight:700;margin-bottom:4px;display:block;text-transform:uppercase}
.form-actions{display:flex;gap:8px;margin-top:16px;justify-content:flex-end;flex-wrap:wrap}
.btn-cancel{padding:10px 18px;background:var(--s2);border:1px solid var(--line);border-radius:8px;font-family:var(--mono);font-size:11px;cursor:pointer;color:var(--t2);font-weight:700}
.btn-save{padding:10px 20px;background:var(--dorado);color:#000;border-radius:8px;font-family:var(--display);font-weight:800;font-size:12px;cursor:pointer;letter-spacing:0.05em}
.btn-del{padding:10px 18px;background:rgba(232,33,10,0.1);border:1px solid rgba(232,33,10,0.35);border-radius:8px;font-family:var(--mono);font-size:11px;cursor:pointer;color:var(--rojo-l);font-weight:700;margin-right:auto}

.toast{position:fixed;top:80px;left:50%;transform:translateX(-50%) translateY(-20px);background:var(--s2);border:1px solid var(--line);border-radius:10px;padding:10px 16px;font-size:12px;color:var(--t1);opacity:0;transition:all 300ms;pointer-events:none;z-index:300}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.ok{border-color:var(--verde);color:var(--verde)}
.toast.err{border-color:var(--rojo);color:var(--rojo-l)}

.loader{padding:40px 20px;text-align:center;color:var(--t3);font-family:var(--mono);font-size:11px}
.loader::before{content:"◐";display:inline-block;animation:spin 1s linear infinite;margin-right:6px;font-size:16px}
@keyframes spin{100%{transform:rotate(360deg)}}

@media(max-width:900px){
  .semana{grid-template-columns:repeat(3,1fr)}
  .kpis{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:640px){
  .semana{grid-template-columns:1fr}
  .form-grid{grid-template-columns:1fr}
  .tec-dias{grid-template-columns:80px 1fr}
}
</style>
</head>
<body>

<header class="bar">
  <button class="back" onclick="location.href=(localStorage.getItem('sv_user_rol')==='coord_junior'?'menu-coord-jr.html':'menu-coordinador.html')">← Volver</button>
  <div class="sigil">📅</div>
  <div class="title">Agenda<small>SERVIRUTA</small></div>
  <button class="btn-add" onclick="abrirNuevo()">+ Nuevo</button>
</header>

<div class="controls">
  <div class="vista-tabs">
    <button class="tab active" data-vista="dia" onclick="cambiarVista('dia')">📆 Por día (carriles técnicos)</button>
    <button class="tab" data-vista="semana" onclick="cambiarVista('semana')">📅 Semana actual</button>
    <button class="tab" data-vista="semana-sig" onclick="cambiarVista('semana-sig')">➡️ Semana entrante</button>
    <button class="tab" data-vista="mes" onclick="cambiarVista('mes')">🗓️ Mes completo</button>
    <button class="tab" data-vista="tecnico" onclick="cambiarVista('tecnico')">🔧 Por técnico (semana)</button>
  </div>
  
  <div class="rango-nav">
    <div class="rango-btns">
      <button class="rango-btn" onclick="navFecha(-1)">← Ayer</button>
      <button class="rango-btn hoy" onclick="irHoy()">Hoy</button>
      <button class="rango-btn" onclick="navFecha(1)">Mañana →</button>
    </div>
    <div class="rango-fecha" id="rango-lbl">Cargando...</div>
    <div class="rango-btns">
      <button class="rango-btn" onclick="navSemana(-1)">← Semana</button>
      <button class="rango-btn" onclick="navSemana(1)">Semana →</button>
    </div>
  </div>
  
  <div class="tec-filter" id="tec-filter"></div>
</div>

<div class="kpis">

function fmtISO(d){
  var y = d.getFullYear(), m = String(d.getMonth()+1).padStart(2,'0'), dd = String(d.getDate()).padStart(2,'0')

  return r
}

// Haversine para distancia geográfica en km
function haversine(lat1, lng1, lat2, lng2){
  var R = 6371
  var dLat = (lat2-lat1) * Math.PI / 180
  var dLng = (lng2-lng1) * Math.PI / 180
  var a = Math.sin(dLat/2) * Math.sin(dLat/2) +
    Math.cos(lat1*Math.PI/180) * Math.cos(lat2*Math.PI/180) *
    Math.sin(dLng/2) * Math.sin(dLng/2)
  return 2 * R * Math.asin(Math.sqrt(a))
}

// Sugerir técnico más cercano para un servicio dado
function sugerirTecnicoPara(servicio){
  if(!servicio.lat || !servicio.lng) return null
  if(TECNICOS.length === 0) return null
  
  // Considerar solo servicios del mismo día
  var mismoDia = EVENTOS.filter(function(e){
    return e.fecha === servicio.fecha && 
           e.id !== servicio.id &&
           e.tecnico && e.tecnico !== 'POR ASIGNAR' &&
           e.lat && e.lng &&
           e.estado !== 'completado' && e.estado !== 'cancelado'
  })
  
  var mejor = null
  var mejorDist = Infinity
  
  TECNICOS.forEach(function(t){
    // Servicios ya asignados a este técnico
    var suyos = mismoDia.filter(function(e){return e.tecnico === t.nombre})
    var referencia = null
    
    if(suyos.length > 0){
      // Centroide de sus servicios
      var sumLat = 0, sumLng = 0
      suyos.forEach(function(s){sumLat += s.lat; sumLng += s.lng})
      referencia = {lat: sumLat/suyos.length, lng: sumLng/suyos.length}
    } else if(t.lat_base && t.lng_base){
      referencia = {lat: parseFloat(t.lat_base), lng: parseFloat(t.lng_base)}
    } else {
      // Sin referencia = Santiago Centro
      referencia = {lat: -33.4489, lng: -70.6693}
    }
    
    var dist = haversine(referencia.lat, referencia.lng, servicio.lat, servicio.lng)
    // Penalización por sobrecarga
    var distEfectiva = dist
    if(suyos.length >= 5) distEfectiva *= 1.4
    else if(suyos.length >= 3) distEfectiva *= 1.15
    
    if(distEfectiva < mejorDist){
      mejorDist = distEfectiva
      mejor = {tecnico: t, distancia: dist, carga: suyos.length}
    }
  })
  
  return mejor
}
function esHoy(d){var hoy = new Date(); hoy.setHours(0,0,0,0); return d.getTime() === hoy.getTime()}

}

async function asignarRapido(id, tecnico){
  var e = EVENTOS.find(function(x){return x.id === id})
  if(!e){ toast('❌ Evento no encontrado', 'err'); return }
  
  var payload = {
    tecnico: tecnico,
    estado: tecnico==='POR ASIGNAR' ? 'solicitada' : (e.estado === 'solicitada' ? 'agendado' : e.estado)
  }
  
  try {
    var r = await sbReq('PATCH', 'agenda?id=eq.'+id, payload)
    if(!r.ok){
      var errTxt = await r.text()
      console.error('PATCH error:', errTxt)
      toast('❌ Error DB: ' + errTxt.substring(0, 40), 'err')
      return
    }
    
    // Actualizar localmente
    e.tecnico = tecnico
    e.estado = payload.estado
    
    if(tecnico === 'POR ASIGNAR'){
      toast('⚠️ Sin asignar', 'ok')
      actualizarKPIs()
      render()
      return
    }
    
    toast('✅ Asignado a ' + tecnico.split(' ')[0], 'ok')
    
    // Buscar técnico en cache local
    var t = TECNICOS.find(function(x){return x.nombre === tecnico})
    
    // Si no está o no tiene teléfono, fetch fresco a la BD
    if(!t || !t.telefono){
      console.log('[NOTIF] Técnico no en cache local, buscando en BD:', tecnico)
      var rTec = await sbReq('GET', 'tecnicos?nombre=eq.' + encodeURIComponent(tecnico) + '&select=nombre,telefono')
      if(rTec.ok){
        var arr = await rTec.json()
        if(arr && arr[0]) t = arr[0]
      }
    }
    
    if(!t || !t.telefono){
      toast('⚠️ Técnico sin teléfono en BD (' + tecnico + ')', 'err')
      console.error('[NOTIF] No se encontró teléfono para:', tecnico, t)
      actualizarKPIs()
      render()
      return
    }
    
    // Armar mensaje
    var hora = (e.hora||'').substring(0,5)
    var fechaObj = e.fecha ? new Date(e.fecha+'T00:00:00') : new Date()
    var fechaFmt = fechaObj.toLocaleDateString('es-CL',{weekday:'long', day:'numeric', month:'long'})
    var urgIcon = e.urgencia==='urgente' ? '🔥 *URGENTE*\n\n' : ''
    var msgTec = urgIcon + '🔧 *Nuevo servicio asignado*\n\n'
    msgTec += '👤 *Cliente:* ' + (e.cliente || 'Sin nombre') + '\n'
    if(e.telefono) msgTec += '📱 *Tel:* +' + e.telefono + '\n'
    if(e.vehiculo) msgTec += '🚗 *Vehículo:* ' + e.vehiculo + '\n'
    msgTec += '🛠️ *Servicio:* ' + (e.servicio || 'Sin detalle') + '\n'
    msgTec += '📅 *Fecha:* ' + fechaFmt + '\n'
    msgTec += '⏰ *Hora:* ' + hora + '\n'
    if(e.direccion) msgTec += '📍 *Dirección:* ' + e.direccion + '\n'
    // Filtrar metadatos internos de las notas antes de mostrar al técnico
    if(e.notas){
      var notasLimpias = e.notas
        .split('\n')
        .filter(function(l){
          var t = l.trim()
          if(!t) return false
          // Excluir líneas que empiezan con [CANCELADO, [Nombre WA, [Reynaldo, etc (metadatos)
          if(/^\[.*\]/.test(t)) return false
          // Excluir "Agendado por bot..." (info interna)
          if(/^Agendado por bot/i.test(t)) return false
          // Excluir "Nombre indicado por cliente..." (ya se pasa como cliente)
          if(/^Nombre indicado por cliente/i.test(t)) return false
          return true
        })
        .join('\n')
        .trim()
      if(notasLimpias) msgTec += '📝 *Notas:* ' + notasLimpias + '\n'
    }
    msgTec += '\n━━━━━━━━━━━━━━━━━━━\n'
    msgTec += '⚠️ *Responde para confirmar:*\n\n'
    msgTec += '✅ *CONFIRMO* → aceptas el servicio\n'
    msgTec += '🚗 *EN CAMINO* → cuando salgas\n'
    msgTec += '✅ *LISTO* → cuando termines\n'
    msgTec += '❌ *RECHAZO* → si no puedes hacerlo'
    
    var telNorm = t.telefono.replace(/[^0-9]/g,'')

async function cancelarServicio(id){
  var e = EVENTOS.find(function(x){return x.id === id})
  if(!e) return
  
  var razon = prompt('Motivo de cancelación (opcional):\n\nEj: "Cliente reagenda", "Cliente cambió de opinión", "Vehículo ya reparado"')
  if(razon === null) return  // Cancel del prompt
  
  var fechaCancel = new Date().toISOString().substring(0,10)
  var lineaCancel = '[CANCELADO ' + fechaCancel + ']' + (razon ? ' ' + razon : '')
  var notasFinal = e.notas ? (e.notas + '\n' + lineaCancel) : lineaCancel
  
  try {
    var r = await sbReq('PATCH', 'agenda?id=eq.'+id, {
      estado: 'cancelado',
      notas: notasFinal
    })
    if(!r.ok){
      var errTxt = await r.text()
      toast('❌ Error: ' + errTxt.substring(0, 40), 'err')
      return
    }
    
    e.estado = 'cancelado'
    e.notas = notasFinal
    toast('✕ Servicio cancelado', 'ok')
    
    // Si tenía técnico asignado, notificarle
    if(e.tecnico && e.tecnico !== 'POR ASIGNAR'){
      var t = TECNICOS.find(function(x){return x.nombre === e.tecnico})
      // Fallback a BD si no está en cache
      if(!t || !t.telefono){
        var rTec = await sbReq('GET', 'tecnicos?nombre=eq.' + encodeURIComponent(e.tecnico) + '&select=nombre,telefono')
        if(rTec.ok){
          var arr = await rTec.json()
          if(arr && arr[0]) t = arr[0]
        }
      }
      
      if(t && t.telefono){
        var hora = (e.hora||'').substring(0,5)
        var fechaObj = e.fecha ? new Date(e.fecha+'T00:00:00') : new Date()
        var fechaFmt = fechaObj.toLocaleDateString('es-CL',{weekday:'long', day:'numeric', month:'long'})
        
        var msgTec = '❌ *Servicio CANCELADO*\n\n'
        msgTec += '👤 *Cliente:* ' + (e.cliente || 'Sin nombre') + '\n'
        msgTec += '🛠️ *Servicio:* ' + (e.servicio || 'Sin detalle') + '\n'
        msgTec += '📅 *Iba para:* ' + fechaFmt + ' · ' + hora + '\n'
        if(razon) msgTec += '\n📝 *Motivo:* ' + razon + '\n'
        msgTec += '\nYa NO vas a este servicio. Elimínalo de tu agenda personal.'
        
        try {
          var envTec = await fetch(SB_URL + '/functions/v1/send-outbound', {
            method: 'POST',
            headers: {'apikey': SB_KEY, 'Authorization': 'Bearer ' + SB_KEY, 'Content-Type': 'application/json'},
            body: JSON.stringify({
              telefono: t.telefono.replace(/[^0-9]/g,''),
              mensaje: msgTec,
              agente_id: 'humano',
              cliente_nombre: t.nombre
            })
          })
          var envData = await envTec.json()
          if(envData.ok) toast('📤 Técnico avisado', 'ok')
          else console.error('Error notif cancelación técnico:', envData)
        } catch(er){
          console.error('Error notif técnico cancelación:', er)
        }
      }
    }
    
    actualizarKPIs()
    render()
  } catch(err){
    console.error(err)
    toast('❌ Error', 'err')
  }
}

async function eliminarServicio(id){
  var e = EVENTOS.find(function(x){return x.id === id})
  if(!e) return
  
  if(!confirm('¿Eliminar completamente este servicio?\n\nCliente: ' + (e.cliente||'?') + '\nServicio: ' + (e.servicio||'?') + '\n\n⚠️ Esta acción NO se puede deshacer.\n\nSi el cliente canceló, usa el botón ✕ CAN (mantiene el historial).')) return
  
  try {
    var r = await sbReq('DELETE', 'agenda?id=eq.'+id)
    if(!r.ok){
      var errTxt = await r.text()
      toast('❌ Error: ' + errTxt.substring(0, 40), 'err')
      return
    }
    
    // Remover del array local
    EVENTOS = EVENTOS.filter(function(x){return x.id !== id})
    toast('🗑 Servicio eliminado', 'ok')
    actualizarKPIs()
    render()
  } catch(err){
    console.error(err)
    toast('❌ Error', 'err')
  }
}

// NUEVO: Geocodificar dirección de UN servicio (con Nominatim)
async function geocodificarUno(id){
  var e = EVENTOS.find(function(x){return x.id === id})
  if(!e || !e.direccion) return
  
  toast('📍 Geocodificando dirección...', 'ok')
  var q = encodeURIComponent(e.direccion + ', Santiago, Chile')
  try {
    var r = await fetch('https://nominatim.openstreetmap.org/search?q='+q+'&format=json&limit=1&countrycodes=cl')
    var data = await r.json()
    if(data && data[0]){
      var lat = parseFloat(data[0].lat)
      var lng = parseFloat(data[0].lon)
      await sbReq('PATCH', 'agenda?id=eq.'+id, {
        lat: lat,
        lng: lng,
        direccion_geocoded_at: new Date().toISOString()
      })
      e.lat = lat
      e.lng = lng
      toast('✅ Ubicación encontrada', 'ok')
      render()
    } else {
      toast('❌ No se encontró la dirección', 'err')
    }
  } catch(err){
    console.error(err)
    toast('❌ Error al geocodificar', 'err')
  }
}

function renderVistaMes(){
  var mesFecha = new Date(FECHA.getFullYear(), FECHA.getMonth(), 1)
  var lastDay = new Date(FECHA.getFullYear(), FECHA.getMonth() + 1, 0)
  var lbl = document.getElementById('rango-lbl')
  lbl.innerHTML = mesFecha.toLocaleDateString('es-CL',{month:'long',year:'numeric'}).toUpperCase()
  lbl.innerHTML += '<small>MES COMPLETO · ' + eventosFiltrados().filter(function(e){
    var f = new Date(e.fecha+'T00:00:00')
    return f.getMonth() === FECHA.getMonth() && f.getFullYear() === FECHA.getFullYear()
  }).length + ' servicios</small>'
  
  // Encontrar el lunes anterior o igual al 1 del mes
  var primerLunes = new Date(mesFecha)
  var day = primerLunes.getDay()
  var diff = day === 0 ? -6 : 1 - day
  primerLunes.setDate(mesFecha.getDate() + diff)
  
  var html = '<div class="mes-hdr-row">'
  var dias = ['Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb', 'Dom']
  dias.forEach(function(d){html += '<div class="hdr">'+d+'</div>'})
  html += '</div>'
  
  html += '<div class="mes">'
  
  // Renderizar hasta 6 semanas (42 días) para cubrir cualquier mes
  var cur = new Date(primerLunes)
  for(var w = 0; w < 6; w++){
    for(var i = 0; i < 7; i++){
      var fechaISO = fmtISO(cur)
      var arr = eventosFiltrados().filter(function(e){return e.fecha === fechaISO}).sort(function(a,b){return (a.hora||'').localeCompare(b.hora||'')})
      var esOtroMes = cur.getMonth() !== FECHA.getMonth()
      var esHoyDia = esHoy(cur)
      var cls = 'dia-mes'
      if(esOtroMes) cls += ' otro-mes'
      if(esHoyDia) cls += ' hoy'
      html += '<div class="'+cls+'">'
      html += '<div class="dia-mes-hdr">'
      html += '<span class="num">'+cur.getDate()+'</span>'
      if(arr.length > 0) html += '<span>'+arr.length+'</span>'
      html += '</div>'
      html += '<div class="dia-mes-body">'
      var maxShow = 4
      arr.slice(0, maxShow).forEach(function(e){
        var hora = (e.hora||'').substring(0,5)
        var urg = e.urgencia === 'urgente' ? ' urg' : ''
        html += '<div class="mini-ev'+urg+'" onclick="editar(\''+e.id+'\')">'
        html += '<div class="mini-ev-hora">'+hora+'</div>'
        html += '<div class="mini-ev-cli">'+(e.cliente || 'Sin nombre').substring(0, 20)+'</div>'
        html += '</div>'
      })
      if(arr.length > maxShow) html += '<div class="mas-eventos">+ '+(arr.length - maxShow)+' más</div>'
      html += '</div>'
      html += '</div>'
      cur.setDate(cur.getDate() + 1)
    }
    // Si ya pasamos el último día del mes y estamos en un domingo, cortar
    if(cur > lastDay && cur.getDay() === 1) break
  }
  html += '</div>'
  document.getElementById('contenido').innerHTML = html
}

function render(){
  if(VISTA === 'dia') renderVistaDia()
  else if(VISTA === 'semana') renderVistaSemana()
  else if(VISTA === 'semana-sig') renderVistaSemanaSig()
  else if(VISTA === 'mes') renderVistaMes()
  else if(VISTA === 'tecnico') renderVistaTecnico()
}

  EDITANDO = null
  document.getElementById('modal-tit').textContent = '➕ Nuevo evento'
  document.getElementById('f-cliente').value = ''
  document.getElementById('f-tel').value = ''
  document.getElementById('f-veh').value = ''
  document.getElementById('f-fecha').value = fmtISO(FECHA)
  document.getElementById('f-hora').value = '10:00'
  document.getElementById('f-servicio').value = ''
  document.getElementById('f-estado').value = 'agendado'
  document.getElementById('f-urg').value = 'normal'
  document.getElementById('f-tecnico').value = 'POR ASIGNAR'
  document.getElementById('f-direccion').value = ''
  document.getElementById('f-notas').value = ''
  document.getElementById('btn-del').style.display = 'none'
  document.getElementById('modal-bg').classList.add('open')
}

function editar(id){
  // Los técnicos no pueden editar campos completos, solo cambiar estado
  if(IS_TECNICO){
    toast('ℹ️ Usa los botones RUTA / ✓ OK para actualizar estado', 'ok')
    return
  }
  var e = EVENTOS.find(function(x){return x.id === id})
  if(!e) return
  EDITANDO = id
  document.getElementById('modal-tit').textContent = '✏️ ' + (e.cliente || 'Evento')
  document.getElementById('f-cliente').value = e.cliente || ''
  document.getElementById('f-tel').value = e.telefono || ''
  document.getElementById('f-veh').value = e.vehiculo || ''
  document.getElementById('f-fecha').value = e.fecha || fmtISO(new Date())
  document.getElementById('f-hora').value = (e.hora || '10:00').substring(0,5)
  document.getElementById('f-servicio').value = e.servicio || ''
  document.getElementById('f-estado').value = e.estado || 'agendado'
  document.getElementById('f-urg').value = e.urgencia || 'normal'
  document.getElementById('f-tecnico').value = e.tecnico || 'POR ASIGNAR'
  document.getElementById('f-direccion').value = e.direccion || ''
  document.getElementById('f-notas').value = e.notas || ''
  document.getElementById('btn-del').style.display = 'inline-block'
  document.getElementById('modal-bg').classList.add('open')
}

function cerrarModal(){document.getElementById('modal-bg').classList.remove('open')}

async function guardar(){
  var cliente = document.getElementById('f-cliente').value.trim()
  var fecha = document.getElementById('f-fecha').value
  var hora = document.getElementById('f-hora').value
  var servicio = document.getElementById('f-servicio').value.trim()
  if(!cliente || !fecha || !hora || !servicio){toast('Cliente, fecha, hora y servicio son obligatorios','err'); return}
  var data = {
    cliente,
    telefono: document.getElementById('f-tel').value.trim() || null,
    vehiculo: document.getElementById('f-veh').value.trim() || null,
    fecha, hora: hora + ':00', servicio,
    estado: document.getElementById('f-estado').value,
    urgencia: document.getElementById('f-urg').value,
    tecnico: document.getElementById('f-tecnico').value,
    direccion: document.getElementById('f-direccion').value.trim() || null,
    notas: document.getElementById('f-notas').value.trim() || null
  }
  var r
  if(EDITANDO){r = await sbReq('PATCH', 'agenda?id=eq.' + EDITANDO, data)}
  else{data.origen = 'manual'; r = await sbReq('POST', 'agenda', data)}
  if(r.ok){toast('✅ Guardado', 'ok'); cerrarModal(); setTimeout(cargar, 300)}
  else{var t = await r.text(); toast('❌ Error: ' + t.substring(0, 60), 'err')}
}

async function eliminarEvento(){
  if(!EDITANDO) return
  if(!confirm('¿Eliminar este evento?')) return
  var r = await sbReq('DELETE', 'agenda?id=eq.' + EDITANDO)
  if(r.ok){toast('🗑 Eliminado', 'ok'); cerrarModal(); setTimeout(cargar, 300)}
  else{toast('❌ Error', 'err')}
}

cargar()
setInterval(cargar, 60000)
</script>
</body>
