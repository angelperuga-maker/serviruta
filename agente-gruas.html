<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Serviruta · Agente Grúas All-in-One</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#F0F0EB;--card:#FFF;--dark:#1A1A1A;--mid:#6B6B6B;--muted:#999;--border:#E5E5E3;--accent:#2563EB;--accent-bg:#EFF6FF;--green:#059669;--green-bg:#ECFDF5;--wa:#25D366;--wa-dark:#128C7E;--user-bubble:#DCF8C6;--radius:18px}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--dark);height:100vh;display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}

/* HEADER */
.header{background:var(--wa-dark);padding:12px 16px;display:flex;align-items:center;gap:12px;color:#fff;flex-shrink:0}
.header-avatar{width:40px;height:40px;border-radius:50%;background:var(--wa);display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700}
.header-info h3{font-size:15px;font-weight:600}
.header-info p{font-size:11px;opacity:.8}
.header-right{margin-left:auto;display:flex;gap:12px;align-items:center}
.header-btn{background:none;border:none;color:#fff;cursor:pointer;opacity:.7;transition:opacity .2s;font-size:13px;font-weight:500}
.header-btn:hover{opacity:1}

/* CHAT */
.chat{flex:1;overflow-y:auto;padding:12px 16px;display:flex;flex-direction:column;gap:6px;-webkit-overflow-scrolling:touch}
.msg{max-width:82%;padding:8px 12px;border-radius:12px;font-size:14px;line-height:1.5;position:relative;word-wrap:break-word}
.msg-bot{background:var(--card);align-self:flex-start;border-bottom-left-radius:4px;box-shadow:0 1px 1px rgba(0,0,0,.06)}
.msg-user{background:var(--user-bubble);align-self:flex-end;border-bottom-right-radius:4px}
.msg-time{font-size:10px;color:var(--muted);margin-top:2px;text-align:right}
.msg-bot .msg-time{text-align:left}
.msg-system{background:rgba(0,0,0,.05);align-self:center;font-size:12px;color:var(--mid);border-radius:8px;padding:4px 14px;max-width:90%;text-align:center}
.typing{display:flex;gap:4px;padding:10px 14px;align-self:flex-start;background:var(--card);border-radius:12px;border-bottom-left-radius:4px}
.typing span{width:7px;height:7px;background:var(--muted);border-radius:50%;animation:blink 1.4s infinite}
.typing span:nth-child(2){animation-delay:.2s}
.typing span:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.3}40%{opacity:1}}

/* INPUT */
.input-area{background:var(--bg);padding:8px 12px;display:flex;gap:8px;align-items:end;flex-shrink:0;border-top:1px solid var(--border)}
.input-wrap{flex:1;background:var(--card);border-radius:24px;padding:4px 16px;display:flex;align-items:center;border:1px solid var(--border)}
.input-wrap textarea{flex:1;border:none;outline:none;font-size:14px;font-family:inherit;resize:none;max-height:100px;padding:8px 0;background:transparent;line-height:1.4}
.send-btn{width:44px;height:44px;border-radius:50%;background:var(--wa);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:background .2s}
.send-btn:hover{background:var(--wa-dark)}
.send-btn svg{fill:#fff;width:22px;height:22px}
.send-btn:disabled{background:var(--muted);cursor:not-allowed}

/* QUICK ACTIONS */
.quick{display:flex;gap:6px;padding:4px 0;overflow-x:auto;-webkit-overflow-scrolling:touch}
.quick::-webkit-scrollbar{display:none}
.quick-btn{white-space:nowrap;padding:6px 14px;border-radius:20px;border:1px solid var(--border);background:var(--card);font-size:12px;font-weight:500;cursor:pointer;color:var(--dark);transition:all .2s;flex-shrink:0}
.quick-btn:hover{border-color:var(--accent);color:var(--accent)}

/* RESUMEN */
.resumen{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px;margin:8px 0;font-size:13px;max-width:82%;align-self:flex-start}
.resumen h4{font-size:13px;font-weight:700;margin-bottom:8px;color:var(--accent)}
.resumen .row{display:flex;justify-content:space-between;padding:3px 0;border-bottom:1px solid #f0f0f0}
.resumen .row:last-child{border-bottom:none}
.resumen .label{color:var(--mid)}
.resumen .val{font-weight:600}
.resumen .total{color:var(--green);font-weight:700;font-size:15px}
</style>
</head>
<body>

<div class="header">
  <div class="header-avatar">🚛</div>
  <div class="header-info">
    <h3>Serviruta Grúas</h3>
    <p>Agente All-in-One · 24/7</p>
  </div>
  <div class="header-right">
    <button class="header-btn" onclick="resetChat()">Nuevo chat</button>
  </div>
</div>

<div class="chat" id="chat"></div>

<div class="input-area">
  <div class="input-wrap">
    <textarea id="input" rows="1" placeholder="Escribe un mensaje..." onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();send()}" oninput="autoResize(this)"></textarea>
  </div>
  <button class="send-btn" id="sendBtn" onclick="send()">
    <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
  </button>
</div>

<script>
// ============================================================
//  SYSTEM PROMPT — AGENTE GRÚAS ALL-IN-ONE
// ============================================================
const SYSTEM = `Eres el agente de atención al cliente de Serviruta Grúas, una red de 105 grúas de asistencia vial en la Región Metropolitana de Santiago, Chile.

## TU PROPUESTA DE VALOR (memorízala)
"Una sola llamada, todo resuelto." El cliente contacta UNA VEZ y nosotros coordinamos:
1. La grúa más cercana para trasladar su vehículo
2. Un mecánico a domicilio Serviruta con 15% de descuento

## TONO Y ESTILO
- Profesional y cercano. Ni muy informal ni muy serio.
- SIN modismos chilenos (nada de "po", "cachai", "wena").
- Empático — el cliente está pasándola mal. Transmite calma y control.
- Siempre refuerza: "con una sola llamada resolvemos todo".
- Nunca digas "no podemos", busca alternativas.

## DATOS QUE DEBES RECOGER (en orden natural, no como formulario)
1. Nombre del cliente
2. Teléfono de contacto (si no es el mismo del chat)
3. Ubicación exacta (dirección, intersección, o referencia + comuna)
4. Tipo de vehículo (auto, camioneta, SUV, moto)
5. Marca y modelo
6. Patente (si la tiene a mano)
7. Qué le pasó al vehículo (problema)
8. A dónde necesita que lo lleven (destino + comuna)

No pidas todo de golpe. Ve preguntando naturalmente en la conversación.

## TABLA DE PRECIOS DE GRÚA (según distancia estimada)

| Distancia estimada | Precio referencial |
|---|---|
| Hasta 5 km (misma comuna) | $29.990 |
| 5-10 km (comunas vecinas) | $35.000 - $45.000 |
| 10-20 km (cruzar Santiago) | $45.000 - $65.000 |
| 20-35 km (periferia RM) | $65.000 - $90.000 |
| 35-50 km (interurbano corto) | $90.000 - $120.000 |
| +50 km (interurbano) | Cotización especial |
| Rescate subterráneo | +$15.000 adicional |
| Moto | Desde $20.000 |

IMPORTANTE SOBRE PRECIOS:
- Siempre di "valor referencial, puede variar según condiciones del servicio"
- El precio incluye carga y descarga
- Peajes NO están incluidos (si aplica, avisar)
- Horario nocturno (22:00-07:00): puede tener recargo de 10-20%

## CÓMO ESTIMAR DISTANCIAS EN SANTIAGO
Usa esta referencia de zonas y distancias aproximadas entre comunas principales:

ZONA SUR: La Florida, Puente Alto, San Bernardo, La Pintana, El Bosque, La Granja
ZONA PONIENTE: Maipú, Cerrillos, Estación Central, Pudahuel, Lo Prado
ZONA ORIENTE: Las Condes, Providencia, Ñuñoa, La Reina, Vitacura, Lo Barnechea
ZONA NORTE: Quilicura, Huechuraba, Conchalí, Recoleta, Independencia, Renca
ZONA CENTRO: Santiago Centro, San Miguel, Macul, San Joaquín

Distancias estimadas entre zonas:
- Dentro de la misma zona: 3-8 km ($29.990 - $40.000)
- Zona vecina (ej: Centro ↔ Sur): 8-15 km ($40.000 - $55.000)
- Zonas opuestas (ej: Sur ↔ Norte, Poniente ↔ Oriente): 15-25 km ($55.000 - $75.000)
- Periferia (Colina, Peñaflor, Melipilla, Buin, Paine, Lampa): 25-50 km ($75.000 - $120.000)

Cuando el cliente te diga origen y destino, estima la distancia y da el precio referencial. Si ambas comunas están en la misma zona, usa el precio base. Si están en zonas distintas, calcula según la tabla.

## CROSS-SELL MECÁNICO (LA JUGADA CLAVE)
Una vez que confirmas el servicio de grúa, ofrece el mecánico:

"Por cierto, por ser cliente de nuestra red tienes un beneficio: te podemos agendar un mecánico Serviruta a domicilio con un 15% de descuento. El mecánico va donde tú estés — sin necesidad de ir a taller. ¿Te interesa?"

Servicios mecánicos disponibles:
- Diagnóstico + scanner computarizado
- Frenos (pastillas, discos)
- Sistema eléctrico / batería
- Motor (distribución, empaquetaduras)
- Neumáticos
- Mantención preventiva

El precio de la visita con diagnóstico es $35.000 → con 15% dcto queda en $29.750.
NO cotizar reparaciones completas por chat. El técnico entrega el valor tras diagnosticar.

## FLUJO DE CONVERSACIÓN

1. SALUDO → "¡Hola! Soy el asistente de Serviruta Grúas. ¿Necesitas una grúa o asistencia vial? Con una sola llamada resolvemos todo — grúa + mecánico con descuento. Cuéntame, ¿qué te pasó?"

2. RECOGER DATOS → Ir pidiendo la info de forma natural. Empezar por "¿Dónde estás?" y "¿Qué le pasó al vehículo?"

3. ESTIMAR PRECIO → Cuando tengas origen y destino, calcula la distancia estimada y da el precio referencial.

4. CONFIRMAR → Resumen con todos los datos: ubicación, destino, vehículo, problema, precio estimado.

5. CROSS-SELL → Ofrecer mecánico con 15% dcto.

6. CIERRE → "Perfecto, vamos a despachar la grúa más cercana. Te confirmo en menos de 2 minutos con los datos del operador y el tiempo estimado de llegada."

## REGLAS IMPORTANTES
- Horario: 24/7 (las grúas operan siempre)
- Cobertura: Solo Región Metropolitana. Fuera de la RM → "Por el momento solo operamos en la Región Metropolitana, pero estamos trabajando para ampliar la cobertura."
- Siempre dar el resumen antes de confirmar
- Nunca inventar tiempos de llegada exactos. Di "entre 15 y 30 minutos dependiendo del tráfico"
- Si el cliente pregunta por el mecánico, dar info pero aclarar que el precio de la reparación lo entrega el técnico tras diagnosticar
- Ante dudas técnicas complejas: "Eso lo puede evaluar nuestro mecánico en terreno. ¿Te agendo la visita con el 15% de descuento?"

## CONTACTO DIRECTO
Si el cliente quiere hablar con una persona:
- WhatsApp: +56 9 8507 9392
- Llamadas: +56 9 8505 8250
`;

// ============================================================
//  CHAT ENGINE
// ============================================================
const chatEl = document.getElementById('chat');
const inputEl = document.getElementById('input');
const sendBtn = document.getElementById('sendBtn');
let history = [];
let isLoading = false;

function init() {
  addBot("¡Hola! Soy el asistente de Serviruta Grúas 🚛\n\nCon *una sola llamada* resolvemos todo: te enviamos la grúa más cercana y te agendamos un mecánico a domicilio con *15% de descuento*.\n\n¿Qué te pasó? Cuéntame y te ayudo al toque.");
  addQuickActions(["Necesito una grúa", "Mi auto no enciende", "Cuánto cuesta un traslado?", "Qué servicios tienen?"]);
}

function addBot(text) {
  const div = document.createElement('div');
  div.className = 'msg msg-bot';
  div.innerHTML = formatText(text) + `<div class="msg-time">${timeNow()}</div>`;
  chatEl.appendChild(div);
  scrollDown();
}

function addUser(text) {
  const div = document.createElement('div');
  div.className = 'msg msg-user';
  div.innerHTML = formatText(text) + `<div class="msg-time">${timeNow()}</div>`;
  chatEl.appendChild(div);
  scrollDown();
}

function addQuickActions(actions) {
  const wrap = document.createElement('div');
  wrap.className = 'quick';
  actions.forEach(a => {
    const btn = document.createElement('button');
    btn.className = 'quick-btn';
    btn.textContent = a;
    btn.onclick = () => { wrap.remove(); inputEl.value = a; send(); };
    wrap.appendChild(btn);
  });
  chatEl.appendChild(wrap);
  scrollDown();
}

function showTyping() {
  const div = document.createElement('div');
  div.className = 'typing';
  div.id = 'typing';
  div.innerHTML = '<span></span><span></span><span></span>';
  chatEl.appendChild(div);
  scrollDown();
}

function hideTyping() {
  document.getElementById('typing')?.remove();
}

async function send() {
  const text = inputEl.value.trim();
  if (!text || isLoading) return;
  
  inputEl.value = '';
  autoResize(inputEl);
  addUser(text);
  
  // Remove quick actions
  document.querySelectorAll('.quick').forEach(q => q.remove());
  
  history.push({ role: 'user', content: text });
  
  isLoading = true;
  sendBtn.disabled = true;
  showTyping();
  
  try {
    const resp = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-6',
        max_tokens: 1000,
        system: SYSTEM,
        messages: history
      })
    });
    
    const data = await resp.json();
    const reply = data.content?.[0]?.text || 'Disculpa, hubo un problema. ¿Puedes intentar de nuevo?';
    
    history.push({ role: 'assistant', content: reply });
    hideTyping();
    addBot(reply);
    
    // Detect if we should show quick actions based on context
    if (history.length <= 3) {
      // Early conversation
    }
    
  } catch (err) {
    hideTyping();
    addBot('Lo siento, hubo un problema de conexión. Mientras tanto puedes contactarnos directamente:\n\n📱 WhatsApp: +56 9 8507 9392\n📞 Llamar: +56 9 8505 8250');
  }
  
  isLoading = false;
  sendBtn.disabled = false;
  inputEl.focus();
}

function resetChat() {
  if (!confirm('¿Iniciar nueva conversación?')) return;
  history = [];
  chatEl.innerHTML = '';
  init();
}

function formatText(text) {
  return text
    .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
    .replace(/\*(.*?)\*/g, '<em>$1</em>')
    .replace(/\n/g, '<br>');
}

function timeNow() {
  return new Date().toLocaleTimeString('es-CL', { hour: '2-digit', minute: '2-digit' });
}

function scrollDown() {
  setTimeout(() => chatEl.scrollTop = chatEl.scrollHeight, 50);
}

function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 100) + 'px';
}

init();
</script>
</body>
</html>
