*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',sans-serif;background:#1a1a1e;color:var(--t1)}
.bar{position:sticky;top:0;z-index:5;background:#0d0d10;color:#fff;padding:10px 14px;display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.bar .t{font-family:Syne,sans-serif;font-weight:800;font-size:14px}
.bar button{background:var(--dorado);border:0;color:#000;font-family:Syne,sans-serif;font-weight:800;font-size:13px;padding:10px 16px;border-radius:10px;cursor:pointer}

.estado{color:#fff;text-align:center;padding:40px 16px;font-size:15px}
#doc{background:#fff;max-width:800px;margin:16px auto;padding:0 0 30px}
.head{background:var(--dorado);padding:22px 28px 18px;border-bottom:4px solid var(--rojo);display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:10px}
.head .logo{font-family:Syne,sans-serif;font-weight:800;font-size:26px;letter-spacing:-0.5px}
.head .sub{font-size:12px;font-weight:700;letter-spacing:.08em;margin-top:2px}
.head .sub2{font-size:11px;color:#333;margin-top:2px}
.head .num{text-align:right;font-family:Syne,sans-serif;font-weight:800;font-size:18px}
.head .num small{display:block;font-family:'DM Sans';font-weight:500;font-size:11px;color:#333}
.sec{padding:0 28px}
h2{font-family:Syne,sans-serif;font-size:13px;letter-spacing:.06em;background:#f0f0f0;padding:7px 10px;margin:18px 0 10px;border-left:4px solid var(--dorado)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:6px 18px;font-size:13px}
.grid b{color:var(--t3);font-weight:600;font-size:11px;letter-spacing:.05em;display:block}
.resumen{margin:18px 28px 0;background:var(--dorado);padding:12px 14px;border-radius:8px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;font-family:Syne,sans-serif;font-weight:800}
.resumen .pills span{display:inline-block;background:#fff;border-radius:20px;padding:4px 12px;font-size:12px;margin-left:6px}
.punto{display:flex;gap:8px;align-items:flex-start;padding:4px 0;border-bottom:1px dashed var(--line);font-size:12.5px;page-break-inside:avoid}
.mark{flex:0 0 18px;height:18px;border-radius:50%;color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center}
.mark.ok{background:var(--ok)}.mark.atencion{background:var(--atn);color:#000}.mark.critico{background:var(--crt)}.mark.na{background:#ccc}
.punto .d{color:var(--t3);font-size:11px}
.punto .nota{font-style:italic;color:#555;font-size:11.5px;margin-top:2px}
.fotos{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 4px 26px}
.fotos img{width:150px;height:112px;object-fit:cover;border-radius:6px;border:1px solid var(--line)}
.veredicto{margin:22px 28px 0;padding:14px 16px;border-radius:8px;color:#fff;font-family:Syne,sans-serif;font-weight:800;font-size:16px;page-break-inside:avoid}
.veredicto.recomendar{background:var(--ok)}.veredicto.negociar{background:var(--atn);color:#000}.veredicto.no_recomendar{background:var(--crt)}
.obs{margin:10px 28px 0;font-size:13px;white-space:pre-wrap}
.firmas{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin:26px 28px 0;page-break-inside:avoid}
.firma{border-top:1px solid #000;padding-top:6px;font-size:12px}
.firma img{display:block;width:100%;max-width:240px;height:80px;object-fit:contain;background:#fff;margin-bottom:4px}
.firma b{display:block;font-size:11px;color:var(--t3);letter-spacing:.05em}
.foot{text-align:center;color:#999;font-size:10px;margin-top:26px}
@media print{body{background:#fff}.bar{display:none}#doc{margin:0;max-width:none}.fotos img{width:120px;height:90px}}

var R=null
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function v(x,suf){return (x===null||x===undefined||x==='')?'—':esc(x)+(suf||'')}
function fmtKm(n){return n?parseInt(n).toLocaleString('es-CL')+' km':'—'}
function fmtCLP(n){return n?'$'+parseInt(n).toLocaleString('es-CL'):'—'}
function fecha(s){try{return new Date(s).toLocaleDateString('es-CL',{day:'2-digit',month:'2-digit',year:'numeric'})}catch(e){return s||'—'}}

async function cargar(){
  var q=new URLSearchParams(location.search)
  var ficha=q.get('ficha'), id=q.get('id')
  var filtro=id?'id=eq.'+encodeURIComponent(id):'numero_ficha=eq.'+encodeURIComponent(ficha||'')
  var r=await fetch(SB_URL+'/rest/v1/revisiones_precompra_camion?select=*&'+filtro+'&limit=1',{headers:{apikey:SB_KEY,Authorization:'Bearer '+SB_KEY}})
  var rows=r.ok?await r.json():[]
  if(!rows.length){document.getElementById('estado').textContent='No se encontró la certificación '+(ficha||id||'');return}
  R=rows[0]; render()
}

function render(){
  var puntos=R.puntos||{}, fotos=R.fotos||[]
  var fpp={}; fotos.forEach(function(f){(fpp[f.punto_id]=fpp[f.punto_id]||[]).push(f.data)})
  var ok=0,atn=0,crt=0
  Object.values(puntos).forEach(function(p){if(p.estado==='ok')ok++;else if(p.estado==='atencion')atn++;else if(p.estado==='critico')crt++})
  var h=''
  h+='<div class="head"><div><div class="logo">SERVI<span style="color:var(--rojo)">RUTA</span></div><div class="sub">CERTIFICACIÓN PREMIUM 120 PUNTOS</div><div class="sub2">Revisión precompra camión · Análisis técnico, fotos y firmas</div></div>'
  h+='<div class="num">'+esc(R.numero_ficha)+'<small>N° CERTIFICACIÓN</small><small>'+fecha(R.fecha_revision||R.created_at)+'</small><small>'+fotos.length+' fotos · '+(ok+atn+crt)+'/120 pts</small></div></div>'
  h+='<div class="sec"><h2>VEHÍCULO CERTIFICADO</h2><div class="grid">'
  h+='<div><b>MARCA / MODELO</b>'+v((R.marca||'')+' '+(R.modelo||''))+'</div><div><b>AÑO</b>'+v(R["año"])+'</div><div><b>PATENTE</b>'+v(R.patente)+'</div><div><b>VIN</b>'+v(R.vin)+'</div><div><b>KILOMETRAJE</b>'+fmtKm(R.kilometraje)+'</div><div><b>COMBUSTIBLE</b>'+v(R.tipo_combustible)+'</div><div><b>COLOR</b>'+v(R.color)+'</div></div>'
  h+='<h2>CLIENTE COMPRADOR</h2><div class="grid"><div><b>NOMBRE</b>'+v(R.cliente_nombre)+'</div><div><b>RUT</b>'+v(R.cliente_rut)+'</div><div><b>TELÉFONO</b>'+v(R.cliente_telefono)+'</div><div><b>EMAIL</b>'+v(R.cliente_email)+'</div></div>'
  if(R.vendedor_nombre||R.vendedor_telefono) h+='<h2>VENDEDOR ACTUAL</h2><div class="grid"><div><b>NOMBRE</b>'+v(R.vendedor_nombre)+'</div><div><b>TELÉFONO</b>'+v(R.vendedor_telefono)+'</div></div>'
  h+='<h2>TÉCNICO CERTIFICADOR SERVIRUTA</h2><div class="grid"><div><b>NOMBRE</b>'+v(R.tecnico_nombre)+'</div><div><b>RUT</b>'+v(R.tecnico_rut)+'</div><div><b>UBICACIÓN</b>'+v(R.ubicacion_revision)+'</div></div></div>'
  h+='<div class="resumen"><div>RESUMEN · '+(ok+atn+crt)+' / 120 puntos</div><div class="pills"><span>✓ OK '+ok+'</span><span>⚠ Atención '+atn+'</span><span>✗ Críticos '+crt+'</span></div></div>'
  var dtc=(R.codigos_dtc||[]).filter(function(c){return c&&c.codigo})
  if(dtc.length){h+='<div class="sec"><h2>📡 ESCÁNER OBD-II · CÓDIGOS DTC</h2>';dtc.forEach(function(c){h+='<div class="punto"><div>'+esc(c.codigo)+' <span class="d">('+esc(c.tipo)+')</span></div></div>'});h+='</div>'}
  var a=R.analisis_aceite||{}
  if(a.aceite_color||a.refri_color) h+='<div class="sec"><h2>🛢️ ANÁLISIS DE FLUIDOS</h2><div class="grid"><div><b>ACEITE MOTOR · COLOR</b>'+v(a.aceite_color)+'</div><div><b>ACEITE MOTOR · OLOR</b>'+v(a.aceite_olor)+'</div><div><b>REFRIGERANTE · COLOR</b>'+v(a.refri_color)+'</div><div><b>REFRIGERANTE · PH</b>'+v(a.refri_ph)+'</div>'+(R.informe_laboratorio_url?'<div><b>INFORME LABORATORIO</b>'+v(R.informe_laboratorio_url)+'</div>':'')+'</div></div>'
  var p=R.prueba_ruta||{}
  if(p.km_inicial||p.descripcion||p.duracion_min) h+='<div class="sec"><h2>🛣️ PRUEBA DE RUTA</h2><div class="grid"><div><b>KM INICIAL → FINAL</b>'+v(p.km_inicial)+' → '+v(p.km_final)+'</div><div><b>RUTA</b>'+v(p.descripcion)+'</div><div><b>DURACIÓN</b>'+v(p.duracion_min,' min')+'</div><div><b>VEL. MÁX</b>'+v(p.velocidad_maxima,' km/h')+'</div><div><b>TEMP. SOSTENIDA</b>'+v(p.temperatura_sostenida,' °C')+'</div></div>'+(p.observaciones?'<div class="obs" style="margin:8px 0 0">'+esc(p.observaciones)+'</div>':'')+'</div>'
  h+='<div class="sec">'
  SECCIONES.forEach(function(s){
    var rev=s.puntos.filter(function(pt){return puntos[pt.id]}).length
    if(!rev) return
    h+='<h2>'+s.icon+' '+esc(s.nombre.toUpperCase())+' ('+rev+'/'+s.puntos.length+')</h2>'
    s.puntos.forEach(function(pt){
      var st=puntos[pt.id]; if(!st) return
      var m=st.estado==='ok'?'✓':(st.estado==='atencion'?'!':'✗')
      h+='<div class="punto"><div class="mark '+esc(st.estado)+'">'+m+'</div><div><div>'+esc(pt.n)+' <span class="d">'+esc(pt.d||'')+'</span></div>'+(st.nota?'<div class="nota">→ '+esc(st.nota)+'</div>':'')+'</div></div>'
      if(fpp[pt.id]){h+='<div class="fotos">';fpp[pt.id].forEach(function(d){h+='<img src="'+d+'">'});h+='</div>'}
    })
  })
  h+='</div>'
  var vl={recomendar:'✅ VEREDICTO CERTIFICADO: RECOMENDAMOS LA COMPRA',negociar:'🟡 VEREDICTO CERTIFICADO: COMPRAR CON NEGOCIACIÓN',no_recomendar:'❌ VEREDICTO CERTIFICADO: NO RECOMENDAMOS LA COMPRA'}
  h+='<div class="veredicto '+esc(R.veredicto)+'">'+(vl[R.veredicto]||esc(R.veredicto))+(R.veredicto==='negociar'&&R.monto_negociacion_sugerido?'<div style="font-size:13px;margin-top:4px">Descuento sugerido: '+fmtCLP(R.monto_negociacion_sugerido)+'</div>':'')+'</div>'
  if(R.observaciones_finales) h+='<div class="obs"><b>Observaciones del certificador:</b>\n'+esc(R.observaciones_finales)+'</div>'
  h+='<div class="firmas"><div class="firma">'+(R.firma_tecnico?'<img src="'+R.firma_tecnico+'">':'')+'<b>TÉCNICO CERTIFICADOR</b>'+v(R.tecnico_nombre)+'<div style="color:#999;font-size:11px">'+fecha(R.firma_tecnico_fecha||R.created_at)+'</div></div>'
  h+='<div class="firma">'+(R.firma_cliente?'<img src="'+R.firma_cliente+'">':'')+'<b>CLIENTE COMPRADOR</b>'+v(R.cliente_nombre)+'<div style="color:#999;font-size:11px">'+fecha(R.firma_cliente_fecha||R.created_at)+'</div></div></div>'
  h+='<div class="foot">Serviruta · +56 9 4521 0814 · serviruta.cl · Certificación '+esc(R.numero_ficha)+'</div>'
  document.getElementById('doc').innerHTML=h
  document.getElementById('doc').style.display='block'
  document.getElementById('estado').style.display='none'
  document.title='Certificación '+R.numero_ficha+' · '+(R.patente||'')
}

function descargarPDF(){
  if(!R) return
  var el=document.getElementById('doc')
  html2pdf().set({margin:[6,6,8,6],filename:R.numero_ficha+'_'+(R.patente||'')+'.pdf',image:{type:'jpeg',quality:0.85},html2canvas:{scale:2,useCORS:true},jsPDF:{unit:'mm',format:'a4',orientation:'portrait'},pagebreak:{mode:['css','legacy'],avoid:['.punto','.fotos','.firmas','.veredicto']}}).from(el).save()
}
cargar()
</script>
</body>
</html>
