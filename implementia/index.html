<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ImplementIA · Central</title>
<meta name="theme-color" content="#161B22">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../implementia-taller/config.js"></script>
<style>
:root{--dark:#161B22;--dark2:#222933;--light:#F5F3EE;--line:#E3DED3;--ink:#1E242C;--soft:#5A6472;--acc:#F26B1D;--accD:#B0470B;--ok:#1F7A4D;--okBg:#E3F2EA;--warn:#9A5B00;--warnBg:#FBEFD9;--bad:#A3302A;--badBg:#F8E3E1;--blue:#1F4E8C;--blueBg:#E2EBF7}
*{box-sizing:border-box}input[type=checkbox]{accent-color:var(--acc)}
html,body{margin:0;background:var(--light);color:var(--ink);font:15px/1.45 Inter,system-ui,Arial,sans-serif;-webkit-font-smoothing:antialiased}
h1,h2,h3{margin:0;line-height:1.2}h1{font-size:22px}h2{font-size:17px}h3{font-size:14px}
a{color:var(--accD)}
.app{display:flex;min-height:100vh}
nav.side{width:224px;background:var(--dark);color:var(--light);padding:18px 12px;flex:none;position:sticky;top:0;height:100vh;overflow:auto}
.brand{font-weight:800;font-size:19px;padding:0 8px 16px;letter-spacing:-.3px}.brand span{color:var(--acc)}.brand small{display:block;font-weight:500;font-size:11px;color:#9AA3AF;letter-spacing:.6px;text-transform:uppercase;margin-top:2px}
nav.side a{display:flex;align-items:center;gap:10px;color:#C9CED6;text-decoration:none;padding:9px 10px;border-radius:9px;font-weight:500;margin-bottom:2px}
nav.side a.on,nav.side a:hover{background:var(--dark2);color:#fff}
nav.side a .n{margin-left:auto;background:var(--acc);color:#1A1208;font-size:11px;font-weight:800;border-radius:999px;padding:1px 7px}
main{flex:1;min-width:0;padding:22px 26px 90px;max-width:1180px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.grid{display:grid;gap:12px}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.kpi{background:var(--dark);color:var(--light);border-radius:14px;padding:13px 14px}
.kpi b{display:block;font-size:22px;font-weight:800;margin-top:2px}.kpi span{font-size:12px;color:#AEB5BF}
.meta{background:linear-gradient(135deg,#161B22,#2A2F38);color:#fff;border-radius:16px;padding:18px}
.meta .big{font-size:38px;font-weight:800;letter-spacing:-1px}.meta .big small{font-size:18px;color:#AEB5BF;font-weight:600}
.prog{height:10px;background:#3A424E;border-radius:99px;overflow:hidden;margin:10px 0 6px}.prog div{height:100%;background:var(--acc);border-radius:99px}
.bar{height:22px;background:#EFEBE3;border-radius:7px;overflow:hidden;flex:1;position:relative}.bar div{height:100%;background:var(--acc);border-radius:7px;min-width:2px}
.frow{display:flex;align-items:center;gap:10px;margin:6px 0;font-size:13px}.frow .l{width:96px;color:var(--soft);font-weight:600}.frow .v{width:34px;text-align:right;font-weight:700}
.btn{text-decoration:none;display:inline-block;border:0;border-radius:10px;padding:9px 14px;font-weight:600;cursor:pointer;background:var(--dark);color:var(--light);font:inherit;font-weight:600;white-space:nowrap}
.btn.acc{background:var(--acc);color:#1A1208}.btn.ghost{background:#fff;border:1px solid var(--line);color:var(--ink)}.btn.ok{background:var(--ok);color:#fff}.btn.bad{background:#fff;border:1px solid #E7C3BF;color:var(--bad)}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:8px}.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.sp{flex:1}
input,select,textarea{border:1px solid var(--line);border-radius:10px;padding:9px 11px;background:#fff;width:100%;font:inherit;color:var(--ink)}
textarea{min-height:90px;resize:vertical}
label{display:block;font-size:12px;font-weight:600;color:var(--soft);margin:10px 0 4px}
.pill{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.3px;padding:3px 8px;border-radius:999px;background:#ECE8E0;color:var(--soft);text-transform:uppercase;white-space:nowrap}
.p-ok{background:var(--okBg);color:var(--ok)}.p-warn{background:var(--warnBg);color:var(--warn)}.p-bad{background:var(--badBg);color:var(--bad)}.p-dark{background:var(--dark);color:var(--light)}.p-acc{background:#FDE6D7;color:var(--accD)}.p-blue{background:var(--blueBg);color:var(--blue)}
.muted{color:var(--soft);font-size:13px}.tiny{font-size:12px;color:var(--soft)}
.list .it{display:flex;gap:12px;align-items:center;padding:11px 4px;border-bottom:1px solid var(--line);cursor:pointer}.list .it:last-child{border-bottom:0}
.score{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-weight:800;flex:none;background:#EFEBE3}
.score.hi{background:#FDE6D7;color:var(--accD)}.score.mid{background:var(--warnBg);color:var(--warn)}
.it .t{font-weight:600}.it .s{font-size:12.5px;color:var(--soft)}
.kanban{display:flex;gap:10px;overflow-x:auto;padding-bottom:10px;scroll-snap-type:x mandatory}
.col{min-width:230px;flex:1;background:#EDE9E1;border-radius:12px;padding:10px;scroll-snap-align:start}
.col h3{font-size:12px;color:var(--soft);text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px;display:flex;justify-content:space-between}
.mini{background:#fff;border-radius:10px;padding:9px 10px;margin-bottom:7px;border:1px solid var(--line);cursor:pointer;font-size:13.5px}
.msg{border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px;background:#fff}
.msg .hd{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.chat{display:flex;flex-direction:column;gap:6px;max-height:420px;overflow:auto;padding:8px;background:#EFEAE2;border-radius:12px}
.bub{max-width:82%;padding:8px 10px;border-radius:12px;font-size:14px;white-space:pre-wrap;word-wrap:break-word}
.bub.in{background:#fff;align-self:flex-start;border-top-left-radius:3px}.bub.out{background:#DCF5D0;align-self:flex-end;border-top-right-radius:3px}
.bub.draft{background:#FFF4E5;border:1px dashed #E8B27A;align-self:flex-end}.bub.note{background:#E8E4DC;align-self:center;font-size:12.5px;color:var(--soft)}
.bub small{display:block;font-size:11px;color:#7A828D;margin-top:3px}
.modal{position:fixed;inset:0;background:rgba(22,27,34,.55);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:30px 12px;overflow:auto}
.sheet{background:var(--light);border-radius:18px;width:100%;max-width:820px;padding:18px;position:relative}
.x{position:absolute;right:12px;top:12px;border:0;background:#fff;border:1px solid var(--line);border-radius:10px;width:36px;height:36px;font-size:18px;cursor:pointer}
.toast{position:fixed;bottom:84px;left:50%;transform:translateX(-50%);background:var(--dark);color:#fff;padding:11px 16px;border-radius:12px;z-index:90;max-width:92vw;font-size:14px;box-shadow:0 6px 20px rgba(0,0,0,.2)}
.login{max-width:380px;margin:12vh auto;padding:0 16px}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 11px;font-size:13px;cursor:pointer;user-select:none}.chip.on{background:var(--dark);color:#fff;border-color:var(--dark)}
.check{display:flex;gap:10px;align-items:center;padding:9px 2px;border-bottom:1px solid var(--line);cursor:pointer}.check input{width:20px;height:20px;flex:none}
.check.done span{color:var(--soft);text-decoration:line-through}
.md h2{font-size:16px;margin:16px 0 6px}.md p{margin:6px 0}.md ul,.md ol{margin:6px 0;padding-left:20px}
pre.g{white-space:pre-wrap;font:inherit;font-size:14px;margin:0;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px}
.empty{padding:26px;text-align:center;color:var(--soft)}
nav.tabs{display:none}
.drawer a{display:block;padding:13px 6px;border-bottom:1px solid var(--line);text-decoration:none;color:var(--ink);font-weight:600}
@media (max-width:860px){
  nav.side{display:none}
  main{padding:14px 12px 96px}
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3,.g2{grid-template-columns:1fr}
  nav.tabs{display:flex;position:fixed;bottom:0;left:0;right:0;background:var(--dark);z-index:40;padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
  nav.tabs a{flex:1;text-align:center;color:#AEB5BF;text-decoration:none;font-size:11px;font-weight:600;padding:4px 0;position:relative}
  nav.tabs a i{display:block;font-style:normal;font-size:20px;line-height:1.2}
  nav.tabs a.on{color:#fff}nav.tabs a .n{position:absolute;top:0;left:55%;background:var(--acc);color:#1A1208;font-size:10px;font-weight:800;border-radius:99px;padding:0 5px}
  .modal{padding:0}.sheet{border-radius:0;min-height:100vh;padding:14px 12px 40px}
  h1{font-size:20px}
}
</style>
</head>
<body>
<div id="root"></div>
<script>
const C = window.IMPL_CONFIG;
const sb = supabase.createClient(C.SUPABASE_URL, C.SUPABASE_ANON_KEY);
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const peso = n => '$' + Math.round(n || 0).toLocaleString('es-CL');
const fecha = d => d ? new Date(d).toLocaleString('es-CL', { weekday: 'short', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }) : '';
const dia = d => d ? new Date(d).toLocaleDateString('es-CL', { day: 'numeric', month: 'short' }) : '';
const hace = d => { if (!d) return ''; const m = Math.round((Date.now() - new Date(d)) / 60000); if (m < 60) return `hace ${m} min`; const h = Math.round(m / 60); if (h < 24) return `hace ${h} h`; return `hace ${Math.round(h / 24)} d`; };
const ESTADOS = { nuevo: 'Nuevo', investigado: 'Investigado', contactado: 'Contactado', respondio: 'Respondió', demo: 'Demo', propuesta: 'Propuesta', cliente: 'Cliente', descartado: 'Descartado' };
const PILL_ESTADO = { nuevo: '', investigado: 'p-blue', contactado: 'p-warn', respondio: 'p-acc', demo: 'p-acc', propuesta: 'p-dark', cliente: 'p-ok', descartado: 'p-bad' };
const AGENTES = { contacto: 'Contacto', seguimiento: 'Seguimiento', recordatorio: 'Recordatorio', propuesta: 'Propuesta', implementador: 'Implementador' };
const CANAL = { whatsapp: 'WhatsApp', email: 'Email', linkedin: 'LinkedIn', llamada: 'Llamada', nota: 'Nota' };
const COMUNAS = ["Santiago","Providencia","Ñuñoa","Las Condes","Vitacura","Lo Barnechea","La Reina","Peñalolén","Macul","La Florida","Puente Alto","San Joaquín","San Miguel","La Cisterna","El Bosque","San Bernardo","La Granja","La Pintana","San Ramón","Lo Espejo","Pedro Aguirre Cerda","Estación Central","Cerrillos","Maipú","Pudahuel","Lo Prado","Quinta Normal","Cerro Navia","Renca","Quilicura","Conchalí","Huechuraba","Independencia","Recoleta"];
let CFG = null, PLANES = [], VISTA = 'inicio';

function toast(t, ms = 3200) { const d = document.createElement('div'); d.className = 'toast'; d.textContent = t; document.body.appendChild(d); setTimeout(() => d.remove(), ms); }
async function q(p) { const { data, error, count } = await p; if (error) { toast('Error: ' + error.message); throw error; } return count != null && data == null ? count : data; }
async function fn(name, body, btn) {
  if (btn) { btn.disabled = true; btn.dataset.t = btn.textContent; btn.textContent = 'Trabajando…'; }
  try {
    const { data, error } = await sb.functions.invoke(name, { body });
    if (error) { let m = error.message; try { m = (await error.context.json()).error || m; } catch { } throw new Error(m); }
    return data;
  } catch (e) { toast(e.message, 5000); throw e; }
  finally { if (btn) { btn.disabled = false; btn.textContent = btn.dataset.t; } }
}
function md(s) {
  const out = []; let list = null;
  const inline = t => esc(t).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
  for (const raw of String(s || '').split('\n')) {
    const l = raw.trim();
    const li = l.match(/^(?:[-•*]|\d+\.)\s+(.*)/);
    if (li) { if (!list) { list = /^\d/.test(l) ? 'ol' : 'ul'; out.push(`<${list}>`); } out.push(`<li>${inline(li[1])}</li>`); continue; }
    if (list) { out.push(`</${list}>`); list = null; }
    if (!l) continue;
    if (l.startsWith('## ')) out.push(`<h2>${inline(l.slice(3))}</h2>`);
    else if (l.startsWith('# ')) out.push(`<h2>${inline(l.slice(2))}</h2>`);
    else out.push(`<p>${inline(l)}</p>`);
  }
  if (list) out.push(`</${list}>`);
  return `<div class="md">${out.join('')}</div>`;
}
const waLink = (dig, texto) => `https://wa.me/${dig}${texto ? '?text=' + encodeURIComponent(texto) : ''}`;
const scoreCls = n => n >= 75 ? 'hi' : n >= 50 ? 'mid' : '';

// ───────────────────────── Login ─────────────────────────
function login(msg = '') {
  $('#root').innerHTML = `<div class="login"><h1 style="font-size:28px">Implement<span style="color:var(--acc)">IA</span></h1>
  <p class="muted" style="margin:6px 0 18px">Central comercial y de clientes. Solo equipo ImplementIA.</p>
  <div class="card"><label>Tu correo</label><input id="em" type="email" autocomplete="email" inputmode="email" value="${esc(localStorage.getItem('impl_email') || '')}">
  <button class="btn acc" id="link" style="width:100%;margin-top:14px;padding:13px">Entrar con mi correo</button>
  <p class="muted" id="msg" style="margin-bottom:0">${esc(msg) || 'Te llega un link al correo. Ábrelo en este mismo teléfono y entras sin contraseña.'}</p></div></div>`;
  $('#em').onkeydown = e => { if (e.key === 'Enter') $('#link').click(); };
  $('#link').onclick = async e => {
    const email = $('#em').value.trim().toLowerCase(); if (!email.includes('@')) return $('#msg').textContent = 'Escribe tu correo.';
    e.target.disabled = true; localStorage.setItem('impl_email', email);
    const { error } = await sb.auth.signInWithOtp({ email, options: { shouldCreateUser: false, emailRedirectTo: location.origin + location.pathname } });
    e.target.disabled = false;
    $('#msg').innerHTML = error ? 'No se pudo enviar: ' + esc(error.message) : `<b>Listo.</b> Revisa ${esc(email)} (también spam) y toca el link. Puedes cerrar esta pestaña.`;
  };
}

async function iniciar() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) return login();
  const { data: staff } = await sb.rpc('es_staff');
  if (!staff) { await sb.auth.signOut(); return login('Tu usuario no es del equipo ImplementIA.'); }
  [CFG, PLANES] = await Promise.all([q(sb.from('ventas_config').select('*').eq('id', 1).single()), q(sb.from('planes').select('*').order('orden'))]);
  marco();
  ir(location.hash.slice(1) || 'inicio');
}

const MENU = [
  ['inicio', '◉', 'Inicio'], ['bandeja', '✉', 'Bandeja'], ['prospectos', '⌕', 'Prospectos'], ['embudo', '▥', 'Embudo'],
  ['conversaciones', '☏', 'Conversaciones'], ['demos', '▶', 'Demos'], ['propuestas', '✎', 'Propuestas'], ['clientes', '★', 'Clientes'], ['anuncios', '◎', 'Anuncios'],
  ['agentes', '⚙', 'Agentes'], ['ajustes', '☰', 'Ajustes'],
];
function marco() {
  $('#root').innerHTML = `<div class="app">
   <nav class="side"><div class="brand">Implement<span>IA</span><small>Central</small></div>
    ${MENU.map(([k, i, t]) => `<a href="#${k}" data-v="${k}"><span>${i}</span>${t}${k === 'bandeja' ? '<span class="n" id="nb1" hidden></span>' : ''}</a>`).join('')}
    <a href="../implementia-taller/" style="margin-top:14px">↗ App de talleres</a>
    <a href="#" id="salir">Salir</a></nav>
   <main id="main"></main>
   <nav class="tabs">${[['inicio', '◉', 'Inicio'], ['bandeja', '✉', 'Bandeja'], ['prospectos', '⌕', 'Prospectos'], ['demos', '▶', 'Demos'], ['menu', '☰', 'Más']]
      .map(([k, i, t]) => `<a href="#${k}" data-v="${k}"><i>${i}</i>${t}${k === 'bandeja' ? '<span class="n" id="nb2" hidden></span>' : ''}</a>`).join('')}</nav></div>`;
  $('#salir').onclick = async e => { e.preventDefault(); await sb.auth.signOut(); login(); };
  contarBandeja();
}
async function contarBandeja() {
  const { count } = await sb.from('prospecto_mensajes').select('id', { count: 'exact', head: true }).in('estado', ['borrador', 'error']);
  for (const id of ['nb1', 'nb2']) { const el = $('#' + id); if (el) { el.hidden = !count; el.textContent = count; } }
}
window.addEventListener('hashchange', () => ir(location.hash.slice(1) || 'inicio'));
function ir(v) {
  VISTA = v;
  $$('nav a[data-v]').forEach(a => a.classList.toggle('on', a.dataset.v === v));
  const m = $('#main'); if (!m) return;
  m.innerHTML = '<div class="empty">Cargando…</div>';
  (VISTAS[v] || VISTAS.inicio)(m).catch(e => { console.error(e); m.innerHTML = `<div class="card">No se pudo cargar: ${esc(e.message)}</div>`; });
  window.scrollTo(0, 0);
}

// ───────────────────────── Vistas ─────────────────────────
const VISTAS = {};

VISTAS.inicio = async m => {
  const [clientes, embudo, log, borr, demos, resp] = await Promise.all([
    q(sb.from('v_clientes').select('*')),
    q(sb.from('v_embudo').select('*')),
    q(sb.from('agente_comercial_log').select('*').order('creado_at', { ascending: false }).limit(8)),
    q(sb.from('prospecto_mensajes').select('id', { count: 'exact', head: true }).in('estado', ['borrador', 'error'])),
    q(sb.from('demos').select('id,inicio,estado,prospecto_id,prospectos(nombre,comuna)').eq('estado', 'agendada').gte('inicio', new Date(Date.now() - 3600e3).toISOString()).order('inicio').limit(5)),
    q(sb.from('prospectos').select('id,nombre,comuna,ultimo_contacto,bot_pausado,proximo_paso').eq('estado', 'respondio').order('ultimo_contacto', { ascending: false }).limit(5)),
  ]);
  const activos = clientes.filter(c => c.estado_cliente !== 'baja');
  const mrr = activos.reduce((s, c) => s + (c.mensual || 0), 0);
  const impl = activos.reduce((s, c) => s + (c.implementacion || 0), 0);
  const meta = CFG.meta_clientes, faltan = Math.max(0, meta - activos.length);
  const dias = Math.max(1, Math.ceil((new Date(CFG.meta_fecha + 'T23:59:00') - Date.now()) / 864e5));
  const ritmo = (faltan / (dias / 7)).toFixed(1);
  const E = Object.fromEntries(embudo.map(e => [e.estado, e.n]));
  const orden = ['nuevo', 'investigado', 'contactado', 'respondio', 'demo', 'propuesta', 'cliente'];
  // acumulado: cuántos llegaron al menos a esa etapa
  const acum = {}; let s = 0; for (const k of [...orden].reverse()) { s += E[k] || 0; acum[k] = s; }
  const max = Math.max(1, acum.nuevo);
  m.innerHTML = `
  <div class="top"><div><h1>Hola ${esc(CFG.vendedor_nombre)}</h1><div class="muted">${new Date().toLocaleDateString('es-CL', { weekday: 'long', day: 'numeric', month: 'long' })}</div></div>
   <button class="btn acc" id="correr">Correr agentes ahora</button></div>
  <div class="meta"><div class="row"><div><div class="tiny" style="color:#AEB5BF;text-transform:uppercase;letter-spacing:.6px;font-weight:700">Meta de clientes</div>
   <div class="big">${activos.length}<small> / ${meta}</small></div></div><div class="sp"></div>
   <div style="text-align:right"><div style="font-size:22px;font-weight:800">${dias} días</div><div class="tiny" style="color:#AEB5BF">al ${new Date(CFG.meta_fecha + 'T12:00').toLocaleDateString('es-CL', { day: 'numeric', month: 'long' })}</div></div></div>
   <div class="prog"><div style="width:${Math.min(100, activos.length / meta * 100)}%"></div></div>
   <div class="tiny" style="color:#C9CED6">${faltan ? `Faltan ${faltan}: necesitas cerrar <b style="color:#fff">${ritmo} por semana</b>.` : '¡Meta cumplida!'}</div></div>
  <div class="grid g4" style="margin:12px 0">
   <div class="kpi"><span>Ingreso mensual (MRR)</span><b>${peso(mrr)}</b></div>
   <div class="kpi"><span>Implementaciones vendidas</span><b>${peso(impl)}</b></div>
   <div class="kpi"><span>Por aprobar</span><b>${borr}</b></div>
   <div class="kpi"><span>Demos agendadas</span><b>${demos.length}</b></div></div>
  <div class="grid g2">
   <div class="card"><h2 style="margin-bottom:8px">Embudo</h2>
    ${orden.map(k => `<div class="frow"><div class="l">${ESTADOS[k]}</div><div class="bar"><div style="width:${acum[k] / max * 100}%"></div></div><div class="v">${acum[k]}</div></div>`).join('')}
    <div class="tiny" style="margin-top:6px">Cuántos llegaron al menos a cada etapa. Descartados: ${E.descartado || 0}.</div></div>
   <div class="card"><h2 style="margin-bottom:6px">Hoy</h2>

VISTAS.bandeja = async m => {
  const msgs = await q(sb.from('prospecto_mensajes').select('*, prospectos(id,nombre,comuna,puntaje,wa_digitos,email,telefono,contacto_nombre)').in('estado', ['borrador', 'error']).order('creado_at').limit(200));
  m.innerHTML = `<div class="top"><div><h1>Bandeja</h1><div class="muted">${msgs.length} mensajes escritos por los agentes. Revisa, ajusta y envía.</div></div>
   <button class="btn ghost" id="gen">Generar más</button></div>
   <div class="card tiny" style="background:#FFF8EE">Consejo: los primeros contactos mándalos con <b>Abrir en WhatsApp</b> desde tu teléfono (pocos al día) y deja <b>Enviar</b> para quienes ya te escribieron. Así cuidas el número.</div>
   <div id="lista">${msgs.length ? '' : '<div class="empty">Bandeja al día. Los agentes dejan mensajes nuevos cada mañana.</div>'}</div>`;
  $('#gen').onclick = async e => { const r = await fn('comercial', { accion: 'contactar' }, e.target); toast(r.resumen, 6000); ir('bandeja'); contarBandeja(); };
  const L = $('#lista');
  for (const x of msgs) {
    const p = x.prospectos || {};
    const d = document.createElement('div'); d.className = 'msg';
    d.innerHTML = `<div class="hd"><b style="cursor:pointer" class="abrir">${esc(p.nombre)}</b><span class="tiny">${esc(p.comuna || '')}</span><div class="sp"></div>
      <span class="pill p-blue">${CANAL[x.canal] || x.canal}</span><span class="pill">${AGENTES[x.agente] || x.agente || ''}${x.paso ? ' · paso ' + x.paso : ''}</span></div>
      ${x.estado === 'error' ? `<div class="pill p-bad" style="text-transform:none;margin-bottom:6px;white-space:normal">${esc(x.error)}</div>` : ''}
      ${x.canal === 'email' ? `<input class="as" value="${esc(x.asunto || '')}" placeholder="Asunto" style="margin-bottom:6px">` : ''}
      <textarea class="tx">${esc(x.texto)}</textarea>
      <div class="row" style="margin-top:8px">${botonesEnvio(x, p)}<div class="sp"></div><button class="btn sm bad des">Descartar</button></div>`;
    L.appendChild(d);
    const ta = $('.tx', d); ta.style.height = Math.max(90, ta.scrollHeight + 4) + 'px';
    $('.abrir', d).onclick = () => ficha(p.id);
    const quitar = () => { d.style.opacity = .4; setTimeout(() => d.remove(), 300); contarBandeja(); };
    const texto = () => $('.tx', d).value;
    $('.des', d).onclick = async () => { await q(sb.from('prospecto_mensajes').update({ estado: 'descartado' }).eq('id', x.id)); quitar(); };
    const api = $('.api', d); if (api) api.onclick = async e => { await fn('comercial', { accion: 'enviar', mensaje_id: x.id, texto: texto(), modo: 'api' }, e.target); toast('Enviado'); quitar(); };
    const man = $('.man', d); if (man) man.onclick = async e => {
      const t = texto(), a = $('.as', d)?.value;
      if (man.dataset.paso !== '2') {
        if (x.canal === 'whatsapp') window.open(waLink(p.wa_digitos, t), '_blank');
        else if (x.canal === 'email') location.href = `mailto:${p.email || ''}?subject=${encodeURIComponent(a || '')}&body=${encodeURIComponent(t)}`;
        else if (x.canal === 'llamada') location.href = `tel:${p.telefono || ''}`;
        man.dataset.paso = '2'; man.textContent = '✓ Ya lo envié'; man.classList.add('ok'); return;
      }
      await fn('comercial', { accion: 'enviar', mensaje_id: x.id, texto: t, asunto: a, modo: 'manual' }, e.target); toast('Registrado'); quitar();
    };
  }
};
function botonesEnvio(x, p) {
  if (x.canal === 'whatsapp') return `${p.wa_digitos ? `<button class="btn sm acc man">Abrir en WhatsApp</button>` : '<span class="tiny">Sin teléfono</span>'}<button class="btn sm api">Enviar (API)</button>`;
  if (x.canal === 'email') return `<button class="btn sm acc man">${p.email ? 'Abrir correo' : 'Sin correo: copiar'}</button>`;
  if (x.canal === 'llamada') return `<button class="btn sm acc man">Llamar</button>`;
  return `<button class="btn sm acc man">Marcar hecho</button>`;
}

function modal(html) {
  const d = document.createElement('div'); d.className = 'modal';
  d.innerHTML = `<div class="sheet"><button class="x">×</button>${html}</div>`;
  document.body.appendChild(d); document.body.style.overflow = 'hidden';
  const cerrar = () => { d.remove(); document.body.style.overflow = ''; };
  $('.x', d).onclick = cerrar; d.onclick = e => { if (e.target === d) cerrar(); };
  d.cerrar = cerrar; return d;
}

}
const campo = (f, l, p, t = 'text') => `<div><label>${l}</label><input data-f="${f}" type="${t}" value="${esc(p[f] ?? '')}"></div>`;
function burbuja(x) {
  if (x.canal === 'nota') return `<div class="bub note">${esc(x.texto)}<small>${fecha(x.creado_at)}</small></div>`;
  const cls = x.direccion === 'entrante' ? 'in' : x.estado === 'borrador' || x.estado === 'error' ? 'draft' : 'out';

const ROLES_T = { dueno: 'Dueño', admin: 'Administración', recepcion: 'Recepción', mecanico: 'Mecánico' };
const AGENTES_T = { seguimiento: 'Seguimiento a clientes', informe_diario: 'Informe diario al dueño', revision_datos: 'Revisión de datos' };
const pct = (a, b) => b ? Math.round(a / b * 100) + '%' : '—';
const dias = d => d ? Math.floor((Date.now() - new Date(d)) / 864e5) : null;

function alertas(s, extra = {}) {
  const a = [];
  const d = dias(s.ultima_actividad);
  if (s.estado_cliente === 'baja') return a;
  if (d === null) a.push(['bad', 'Todavía no usa el sistema']);
  else if (d > 7) a.push(['bad', `Sin actividad hace ${d} días`]);
  else if (d > 3) a.push(['warn', `Poca actividad: último movimiento hace ${d} días`]);
  if (s.deuda_vencida > 0) a.push(['bad', `Deuda vencida ${peso(s.deuda_vencida)}`]);
  if (!s.wa_conectado) a.push(['warn', 'WhatsApp no conectado']);
  else if (!s.bot_activo) a.push(['warn', 'Bot de WhatsApp apagado']);
  if (s.pedidos_pendientes > 0) a.push(['warn', `${s.pedidos_pendientes} pedido(s) de anuncios sin resolver`]);
  if (s.campanas_activas > 0 && !s.inversion_ads_mes) a.push(['warn', 'Campañas activas sin resultados cargados este mes']);
  if (s.ots_abiertas > 0 && !s.ventas_mes && d !== null && d < 30) a.push(['warn', 'Órdenes abiertas pero sin ventas pagadas este mes']);
  if (extra.implAtrasada) a.push(['bad', 'Implementación atrasada']);
  return a;
}
const semaforo = al => al.some(x => x[0] === 'bad') ? ['p-bad', 'En riesgo'] : al.length ? ['p-warn', 'Atención'] : ['p-ok', 'Sano'];

async function guardarCampos(el, tabla, pk, id) {
  const upd = {}; $$('[data-t]', el).forEach(i => { const v = i.value.trim(); upd[i.dataset.t] = v === '' ? null : i.type === 'number' ? +v : v; });
  if ('nombre' in upd && !upd.nombre) return toast('El nombre no puede quedar vacío');
  await q(sb.from(tabla).update(upd).eq(pk, id)); toast('Guardado');
}

function cargarResultados(tid, cid, hist, despues) {

  const [res, camp, ped, tall] = await Promise.all([
    q(sb.from('v_campanas_mes').select('*')),
    q(sb.from('campanas').select('id,objetivo,servicio,presupuesto_mensual')),
    q(sb.from('pedidos_anuncios').select('*, talleres(nombre)').neq('estado', 'hecho').order('creado_at')),
    q(sb.from('talleres').select('id,nombre,es_demo,presupuesto_ads_mensual')),
  ]);
  const T = Object.fromEntries(tall.map(t => [t.id, t])); const K = Object.fromEntries(camp.map(c => [c.id, c]));
  const reales = res.filter(r => !T[r.taller_id]?.es_demo);
  const tot = reales.reduce((a, c) => ({ i: a.i + c.inversion, m: a.m + c.mensajes, ag: a.ag + Number(c.agendados), v: a.v + Number(c.monto_vendido) }), { i: 0, m: 0, ag: 0, v: 0 });
  const orden = { activa: 0, programada: 1, pausada: 2, terminada: 3 };
  reales.sort((a, b) => (orden[a.estado] - orden[b.estado]) || (b.inversion - a.inversion));
  m.innerHTML = `<div class="top"><div><h1>Anuncios</h1><div class="muted">Todas las campañas de tus clientes, este mes.</div></div></div>
   <div class="grid g4" style="margin-bottom:12px"><div class="kpi"><span>Inversión total</span><b>${peso(tot.i)}</b></div><div class="kpi"><span>Mensajes</span><b>${tot.m}</b></div>
    <div class="kpi"><span>Costo por mensaje</span><b>${tot.m ? peso(tot.i / tot.m) : '—'}</b></div><div class="kpi"><span>Vendido por anuncios</span><b>${peso(tot.v)}</b></div></div>
   ${ped.length ? `<div class="card" style="background:#FFF8EE"><h3 style="margin-bottom:6px">Pedidos pendientes de los talleres (${ped.length})</h3>${ped.map(p => `<div class="it" data-t="${p.taller_id}" data-tab="anuncios" style="display:flex;gap:10px;padding:8px 0;cursor:pointer;border-bottom:1px solid var(--line)"><span class="pill p-acc">${esc(p.talleres?.nombre)}</span><span class="sp">${esc(p.texto)}</span><span class="tiny">${hace(p.creado_at)}</span></div>`).join('')}</div>` : ''}
   <div class="card" style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:13.5px;min-width:720px"><thead><tr style="text-align:left;color:var(--soft);font-size:12px">
    <th style="padding:8px">Taller · campaña</th><th>Estado</th><th>Inversión</th><th>Presupuesto</th><th>Mensajes</th><th>Costo/msj</th><th>Agendados</th><th>Vendido</th><th>Retorno</th></tr></thead><tbody>
    ${reales.length ? reales.map(r => { const k = K[r.campana_id] || {}; return `<tr data-t="${r.taller_id}" data-tab="anuncios" style="border-top:1px solid var(--line);cursor:pointer">
     <td style="padding:9px 8px"><b>${esc(T[r.taller_id]?.nombre)}</b><div class="tiny">${esc(r.nombre)} · ${r.plataforma}${k.servicio ? ' · ' + esc(k.servicio) : ''}</div></td>
     <td><span class="pill ${r.estado === 'activa' ? 'p-ok' : r.estado === 'programada' ? 'p-warn' : ''}">${r.estado}</span></td><td>${peso(r.inversion)}</td>
     <td>${k.presupuesto_mensual ? pct(r.inversion, k.presupuesto_mensual) : '—'}</td><td>${r.mensajes}</td><td>${r.mensajes ? peso(r.inversion / r.mensajes) : '—'}</td>
     <td>${r.agendados}</td><td>${peso(r.monto_vendido)}</td><td><b>${r.inversion ? (r.monto_vendido / r.inversion).toFixed(1) + 'x' : '—'}</b></td></tr>`; }).join('') : '<tr><td colspan="9" class="empty">Sin campañas todavía.</td></tr>'}
   </tbody></table></div>`;
  $$('[data-t]', m).forEach(e => e.onclick = () => panelCliente(e.dataset.t, e.dataset.tab));
};

async function checklist(tid) {
  const im = await q(sb.from('implementaciones').select('*, talleres(nombre)').eq('taller_id', tid).maybeSingle());
  if (!im) return toast('Este cliente no tiene plan de implementación.');
  const d = modal(`<h2>Implementación · ${esc(im.talleres?.nombre)}</h2><div class="tiny">Inicio ${dia(im.inicio)} · entrega objetivo ${dia(im.entrega_objetivo)}</div>
   <div class="card" style="margin-top:12px">${im.checklist.map((t, i) => `<label class="check ${t.hecho ? 'done' : ''}" style="margin:0"><input type="checkbox" data-i="${i}" ${t.hecho ? 'checked' : ''}><span>${esc(t.tarea)}</span></label>`).join('')}</div>
   <label>Notas</label><textarea id="nt">${esc(im.notas || '')}</textarea><div class="row" style="margin-top:10px"><button class="btn" id="g">Guardar notas</button><button class="btn ghost" id="ent">Marcar entregada</button></div>`);
  $$('[data-i]', d).forEach(c => c.onchange = async () => {
    im.checklist[+c.dataset.i].hecho = c.checked; c.parentElement.classList.toggle('done', c.checked);
    await q(sb.from('implementaciones').update({ checklist: im.checklist }).eq('id', im.id));
  });
  $('#g', d).onclick = async () => { await q(sb.from('implementaciones').update({ notas: $('#nt', d).value }).eq('id', im.id)); toast('Guardado'); };
  $('#ent', d).onclick = async () => { await q(sb.from('implementaciones').update({ estado: 'entregada' }).eq('id', im.id)); await q(sb.from('talleres').update({ estado_cliente: 'activo' }).eq('id', tid)); toast('¡Entregada! Cliente activo.'); d.cerrar(); if (VISTA === 'clientes') ir('clientes'); };
}

// ── Agentes ──
VISTAS.agentes = async m => {
  const log = await q(sb.from('agente_comercial_log').select('*').order('creado_at', { ascending: false }).limit(60));
  const ult = a => log.find(l => l.agente === a);
  const A = [
    ['prospector', '1 · Prospector', 'Trae talleres de Google Maps y les pone puntaje.', 'Buscar talleres', () => buscarTalleres()],
    ['investigador', '2 · Investigador', `Revisa reseñas y sitio web de los mejores ${CFG.investigar_por_dia} nuevos y escribe diagnóstico y gancho.`, 'Investigar ahora', e => fn('comercial', { accion: 'investigar' }, e.target)],
    ['contacto', '3 · Contacto', `Escribe hasta ${CFG.limite_diario_contactos} mensajes al día según la secuencia, más seguimientos y recordatorios.`, 'Escribir mensajes', e => fn('comercial', { accion: 'contactar' }, e.target)],
    ['vendedor', '4 · Vendedor WhatsApp', CFG.wa_phone_number_id ? 'Responde, califica y agenda demos en el número de ventas.' : 'Falta conectar el número de ventas (Ajustes).', null],
    ['demo', '5 · Preparador de demo', 'Crea el taller demo con datos del prospecto y escribe el guion.', null],
    ['propuesta', '6 · Propuesta', 'Escribe la propuesta personalizada y la manda con link para aceptar.', null],
    ['implementador', '7 · Implementador', 'Al aceptar: crea el taller cliente, copia el catálogo y arma el checklist.', null],
    ['orquestador', 'Orquestador diario', 'Lunes a sábado 08:30: investiga y deja la Bandeja lista.', 'Correr todo', e => fn('comercial', { accion: 'diario' }, e.target)],
  ];
  m.innerHTML = `<div class="top"><h1>Agentes</h1></div><div class="grid g2">${A.map(([k, t, desc, b], i) => { const u = ult(k); return `<div class="card"><div class="row"><h3 class="sp">${t}</h3>${u ? `<span class="tiny">${hace(u.creado_at)}</span>` : ''}</div>
    <div class="muted" style="margin:6px 0">${esc(desc)}</div>${u ? `<div class="tiny" style="margin-bottom:8px">Última: ${esc(u.resumen)}</div>` : ''}${b ? `<button class="btn sm" data-i="${i}">${b}</button>` : ''}</div>`; }).join('')}</div>
   <div class="card"><h2 style="margin-bottom:6px">Bitácora</h2><div class="list">${log.map(l => `<div class="it" style="cursor:default"><span class="pill">${esc(l.agente)}</span><div class="sp" style="font-size:13.5px">${esc(l.resumen)}</div><span class="tiny">${fecha(l.creado_at)}</span></div>`).join('') || '<div class="empty">Sin actividad.</div>'}</div></div>`;
  $$('[data-i]', m).forEach(b => b.onclick = async e => { const r = await A[+b.dataset.i][4](e); if (r?.resumen) { toast(r.resumen, 6000); ir('agentes'); contarBandeja(); } });
};

// ── Ajustes ──
VISTAS.ajustes = async m => {
  const pasos = await q(sb.from('secuencia_pasos').select('*').order('paso'));
  const c = CFG;
  const f = (k, l, t = 'text') => `<div><label>${l}</label><input data-k="${k}" type="${t}" value="${esc(c[k] ?? '')}"></div>`;
  m.innerHTML = `<div class="top"><h1>Ajustes</h1></div>
   <div class="card"><h2>Ventas</h2><div class="grid g2">${f('vendedor_nombre', 'Quién firma')}${f('empresa', 'Empresa')}${f('meta_clientes', 'Meta de clientes', 'number')}${f('meta_fecha', 'Fecha meta', 'date')}
    ${f('limite_diario_contactos', 'Contactos nuevos por día', 'number')}${f('investigar_por_dia', 'Talleres a investigar por día', 'number')}${f('duracion_demo_min', 'Duración demo (min)', 'number')}${f('cuotas_fundador', 'Cuotas fundador', 'number')}${f('descuento_fundador_pct', 'Descuento fundador (%)', 'number')}</div>
    <label>Oferta fundador</label><textarea data-k="oferta_fundador">${esc(c.oferta_fundador)}</textarea>
    <label>Garantía</label><textarea data-k="garantia">${esc(c.garantia)}</textarea>
    <label>Horario de demos (JSON)</label><textarea data-k="horario_demos" data-json="1" style="font-family:monospace;font-size:13px">${esc(JSON.stringify(c.horario_demos))}</textarea>
    <label>Instrucciones extra para el bot vendedor</label><textarea data-k="instrucciones_extra">${esc(c.instrucciones_extra || '')}</textarea></div>
   <div class="card"><h2>WhatsApp de ventas</h2><p class="muted">Un número de WhatsApp Business solo para ImplementIA, en la misma app de Meta que los talleres.</p><div class="grid g2">
    ${f('wa_numero', 'Número visible (+56…)')}${f('wa_phone_number_id', 'Phone number ID (Meta)')}${f('wa_plantilla', 'Plantilla de primer contacto (nombre)')}${f('wa_plantilla_idioma', 'Idioma plantilla')}</div>
    <label class="check" style="margin-top:8px;border:0"><input type="checkbox" data-k="bot_activo" ${c.bot_activo ? 'checked' : ''}><span>Bot vendedor activo</span></label></div>
   <div class="row" style="margin-bottom:14px"><button class="btn acc" id="gc">Guardar ajustes</button></div>
   <div class="card"><h2>Secuencia de contacto</h2><p class="muted">Qué hace el agente de contacto en cada paso. Se detiene apenas el taller responde.</p>
    ${pasos.map(s => `<div style="padding:10px 0;border-bottom:1px solid var(--line)"><div class="row"><b>Paso ${s.paso}</b><span class="tiny">día</span><input data-p="${s.paso}" data-c="dia" type="number" value="${s.dia}" style="width:70px">
     <select data-p="${s.paso}" data-c="canal" style="width:auto">${['whatsapp', 'email', 'linkedin', 'llamada'].map(x => `<option ${x === s.canal ? 'selected' : ''}>${x}</option>`).join('')}</select></div>
     <textarea data-p="${s.paso}" data-c="objetivo" style="margin-top:6px;min-height:60px">${esc(s.objetivo)}</textarea></div>`).join('')}
    <div class="row" style="margin-top:10px"><button class="btn" id="gs">Guardar secuencia</button></div></div>
   <div class="card"><h2>Planes y precios</h2>${PLANES.map(p => `<div class="grid g3" style="gap:8px;padding:8px 0;border-bottom:1px solid var(--line)"><div><label>Plan</label><input data-pl="${p.codigo}" data-c="nombre" value="${esc(p.nombre)}"></div>
     <div><label>Implementación</label><input data-pl="${p.codigo}" data-c="implementacion" type="number" value="${p.implementacion}"></div><div><label>Mensual</label><input data-pl="${p.codigo}" data-c="mensual" type="number" value="${p.mensual}"></div></div>`).join('')}
    <div class="row" style="margin-top:10px"><button class="btn" id="gp">Guardar planes</button></div></div>
   <div class="card"><h2>Para que todo funcione</h2><ol class="muted" style="padding-left:18px;margin:6px 0">
    <li>En Supabase → Edge Functions → Secrets: <b>GOOGLE_PLACES_KEY</b>, <b>ANTHROPIC_API_KEY</b>, <b>WA_ACCESS_TOKEN</b>, <b>WA_VERIFY_TOKEN</b>.</li>
    <li>Sin la llave de Anthropic los agentes funcionan con textos de plantilla.</li>
    <li>Número de ventas: agrégalo en la app de Meta (webhook <code>whatsapp-webhook</code>) y pon su Phone number ID arriba.</li>
    <li>Plantilla de primer contacto: créala en Meta (categoría marketing) con una variable {{1}} para el nombre.</li></ol></div>`;
  $('#gc').onclick = async () => {
    const upd = {};
    for (const i of $$('[data-k]', m)) { const k = i.dataset.k; if (i.type === 'checkbox') upd[k] = i.checked; else if (i.dataset.json) { try { upd[k] = JSON.parse(i.value); } catch { return toast('El horario no es JSON válido'); } } else upd[k] = i.type === 'number' ? +i.value : (i.value.trim() || null); }
    CFG = await q(sb.from('ventas_config').update(upd).eq('id', 1).select('*').single()); toast('Ajustes guardados');
  };
  $('#gs').onclick = async () => { for (const s of pasos) { const g = c2 => $(`[data-p="${s.paso}"][data-c="${c2}"]`, m).value; await q(sb.from('secuencia_pasos').update({ dia: +g('dia'), canal: g('canal'), objetivo: g('objetivo') }).eq('paso', s.paso)); } toast('Secuencia guardada'); };
  $('#gp').onclick = async () => { for (const p of PLANES) { const g = c2 => $(`[data-pl="${p.codigo}"][data-c="${c2}"]`, m).value; await q(sb.from('planes').update({ nombre: g('nombre'), implementacion: +g('implementacion'), mensual: +g('mensual') }).eq('codigo', p.codigo)); } PLANES = await q(sb.from('planes').select('*').order('orden')); toast('Planes guardados'); };
};

// ── Menú (móvil) ──
VISTAS.menu = async m => {
  m.innerHTML = `<h1 style="margin-bottom:10px">Más</h1><div class="card drawer">${MENU.map(([k, i, t]) => `<a href="#${k}">${i}&nbsp;&nbsp;${t}</a>`).join('')}<a href="../implementia-taller/">↗&nbsp;&nbsp;App de talleres</a><a href="#" id="salir2">Salir</a></div>`;
  $('#salir2').onclick = async e => { e.preventDefault(); await sb.auth.signOut(); login(); };
};

sb.auth.onAuthStateChange((ev) => { if (ev === 'SIGNED_OUT') login(); });
iniciar();
</script>
