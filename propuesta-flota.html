<style>
:root{--rojo:#E8210A;--ink:#111;--ink2:#444;--ink3:#777;--line:#ddd;--bg:#f3f1ec;--paper:#fff}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:"DM Sans",system-ui,sans-serif;font-size:14px;line-height:1.5}
h1,h2,h3{font-family:"Syne",sans-serif;font-weight:700;line-height:1.2}
.bar{position:sticky;top:0;z-index:5;background:#111;color:#fff;padding:10px 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.bar .sp{flex:1}
.bar button,.bar a{font:600 13px "DM Sans",sans-serif;border:0;border-radius:8px;padding:9px 14px;cursor:pointer;text-decoration:none;color:#fff;background:#2a2a2e}
.bar .pri{background:var(--rojo)}
.bar .seg{display:flex;border:1px solid #3a3a40;border-radius:8px;overflow:hidden}
.bar .seg button{border-radius:0;background:transparent;padding:8px 12px}
.bar .seg button.on{background:#fff;color:#111}
.page{max-width:860px;margin:18px auto;background:var(--paper);padding:34px 40px;box-shadow:0 2px 20px rgba(0,0,0,.08)}
.head{display:flex;justify-content:space-between;gap:16px;border-bottom:3px solid var(--rojo);padding-bottom:14px;margin-bottom:18px;flex-wrap:wrap}
.brand{font-family:"Syne",sans-serif;font-weight:800;font-size:24px}
.brand span{color:var(--rojo)}
.brand small{display:block;font-family:"DM Sans";font-weight:500;font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--ink3)}
.meta{text-align:right;font-size:12.5px;color:var(--ink2)}
.meta b{display:block;font-size:15px;color:var(--ink)}
h1{font-size:22px;margin:6px 0 2px}
.sub{color:var(--ink2);margin-bottom:14px}
h2{font-size:15px;text-transform:uppercase;letter-spacing:.6px;color:var(--rojo);margin:22px 0 8px;padding-top:6px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:6px 24px}
.kv{font-size:13px}.kv span{color:var(--ink3);display:block;font-size:11px;text-transform:uppercase;letter-spacing:.5px}
.box{border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-top:8px}
.plan{display:flex;gap:16px;flex-wrap:wrap;align-items:flex-start}
.plan .n{flex:1 1 260px}.plan .n h3{font-size:18px}.plan .n p{color:var(--ink2);margin-top:4px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.chip{font-size:12px;border:1px solid var(--line);border-radius:20px;padding:3px 10px;color:var(--ink2)}
ul{padding-left:18px}li{margin:3px 0}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:16px}
table{width:100%;border-collapse:collapse;font-size:13px;margin-top:6px}
th,td{padding:8px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--ink3);font-weight:600}
td.r,th.r{text-align:right;white-space:nowrap}
tfoot td{font-weight:600}
tfoot tr.tot td{font-size:16px;border-top:2px solid var(--ink);border-bottom:0}
th.hi,td.hi{background:#fff4f2}
.note{font-size:12px;color:var(--ink2);margin-top:6px}
ol.cl{padding-left:20px}ol.cl li{margin:7px 0}ol.cl b{display:inline}
.firma{display:grid;grid-template-columns:1fr 1fr;gap:30px;margin-top:40px}
.firma div{border-top:1px solid var(--ink);padding-top:6px;font-size:12px;color:var(--ink2)}
.foot{margin-top:28px;padding-top:12px;border-top:1px solid var(--line);font-size:12px;color:var(--ink3);display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px}
.err{max-width:860px;margin:40px auto;background:#fff;padding:30px;border-radius:12px;text-align:center;color:var(--ink2)}
.pb,tr,h2,.kv{page-break-inside:avoid;break-inside:avoid}
h2{page-break-after:avoid;break-after:avoid}
@media (max-width:600px){.page{padding:22px 18px;margin:0}.grid,.cols,.firma{grid-template-columns:1fr}.meta{text-align:left}}
@media print{
  @page{size:A4;margin:14mm 12mm}
  body{background:#fff;font-size:12.5px}
  .bar{display:none}
  .page{box-shadow:none;margin:0;padding:0;max-width:none}
  h2{page-break-after:avoid}
  a{color:inherit;text-decoration:none}
}
</style>
